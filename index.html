<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7FAF3">
<meta name="description" content="优优教育一年级上册语文拼音闯关学习网站">
<title>优优教育 · 拼音闯关</title>
<style>
:root{
  --paper:#F7FAF3;
  --paper-2:#F0F6EA;
  --card:#FFFFFF;
  --ink:#20342D;
  --ink-2:#415A4F;
  --muted:#6F8378;
  --primary:#287A58;
  --primary-d:#1D6042;
  --primary-soft:#E3F2E7;
  --coral:#E96C54;
  --sun:#F2BE3E;
  --sky:#4B9CC7;
  --line:rgba(32,52,45,.11);
  --line-strong:rgba(32,52,45,.18);
  --shadow:0 10px 28px rgba(37,75,57,.08),0 2px 8px rgba(37,75,57,.04);
  --shadow-lg:0 24px 64px rgba(37,75,57,.14),0 8px 22px rgba(37,75,57,.07);
  --r-xl:30px;
  --r-lg:22px;
  --r-md:15px;
  --r-sm:10px;
  --ease:cubic-bezier(.22,1,.36,1);
  --top:72px;
  --bottom:76px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  padding-top:var(--top);
  padding-bottom:calc(var(--bottom) + 28px);
  font-family:"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  background-image:radial-gradient(rgba(40,122,88,.08) 1px,transparent 1px);
  background-size:20px 20px;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,h4,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid #76BFD8;outline-offset:3px;border-radius:10px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hidden{display:none !important}

/* Fixed chrome */
.topbar{
  position:fixed;
  top:0;left:0;right:0;
  height:var(--top);
  z-index:70;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 max(16px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left));
  background:rgba(247,250,243,.82);
  -webkit-backdrop-filter:blur(22px) saturate(1.7);
  backdrop-filter:blur(22px) saturate(1.7);
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex;align-items:center;gap:10px;min-width:0;padding:4px;border-radius:14px;
  transition:transform .2s var(--ease),background .2s;
}
.brand:hover{background:rgba(255,255,255,.7)}
.brand:active{transform:scale(.97)}
.brand-logo{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px;
  background:#E7F3E7;
  box-shadow:inset 0 0 0 1px #fff,0 5px 12px rgba(40,122,88,.13);
  flex:none;
}
.brand-text{min-width:0;text-align:left;line-height:1.15}
.brand-name{display:block;font-size:15px;font-weight:900;letter-spacing:.01em}
.brand-sub{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:2px;white-space:nowrap}
.top-spacer{flex:1}
.star-chip{
  height:40px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;
  background:#fff;border:1px solid var(--line);box-shadow:0 3px 10px rgba(37,75,57,.06);
  font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.star-chip .s-icon{font-size:17px;line-height:1}
.star-chip .s-total{font-size:11px;color:var(--muted);font-weight:800}
.star-chip.pop{animation:chipPop .52s var(--ease)}
@keyframes chipPop{0%{transform:scale(1)}42%{transform:scale(1.13)}100%{transform:scale(1)}}
.icon-btn,.sound-btn{
  height:40px;border-radius:999px;background:#fff;border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:0 12px;font-size:12px;font-weight:900;box-shadow:0 3px 10px rgba(37,75,57,.06);
  transition:transform .2s var(--ease),background .2s,opacity .2s;
}
.icon-btn{width:40px;padding:0;font-size:17px}
.icon-btn:hover,.sound-btn:hover{transform:translateY(-1px);background:#FCFDFB}
.icon-btn:active,.sound-btn:active{transform:scale(.95)}
.sound-btn[aria-pressed="false"]{opacity:.62}
.parent-btn{
  height:40px;padding:0 15px;border-radius:999px;background:var(--ink);color:#fff;
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:900;
  box-shadow:0 6px 16px rgba(32,52,45,.18);transition:transform .2s var(--ease),background .2s;
}
.parent-btn:hover{transform:translateY(-1px);background:#2B473C}
.parent-btn:active{transform:scale(.96)}
.pb-short{display:none}

/* Author bar */
.authorbar{
  position:fixed;left:0;right:0;bottom:0;height:var(--bottom);z-index:65;
  background:rgba(255,254,250,.88);
  -webkit-backdrop-filter:blur(22px) saturate(1.6);
  backdrop-filter:blur(22px) saturate(1.6);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.author-inner{
  max-width:1240px;height:100%;margin:0 auto;padding:0 22px;
  display:flex;align-items:center;gap:12px;
}
.author-photo{
  width:44px;height:44px;border-radius:13px;object-fit:cover;flex:none;background:#E7F3E7;
  box-shadow:0 0 0 2px #fff,0 4px 12px rgba(32,52,45,.15);
}
.author-meta{line-height:1.3;min-width:0}
.author-meta b{display:block;font-size:14px;font-weight:900}
.author-meta span{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:2px}
.author-line{flex:1}
.author-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;color:var(--primary-d);
  background:var(--primary-soft);padding:7px 12px;border-radius:999px;white-space:nowrap;
}

/* App shell */
.app{max-width:1240px;margin:0 auto;padding:22px 22px 0}
.home-intro{max-width:820px;margin:4px 0 18px}
.home-intro h1{
  font-size:44px;font-size:clamp(32px,4.6vw,52px);line-height:1.05;letter-spacing:-.03em;font-weight:900;
  margin:0 0 11px;
}
.home-intro h1 em{font-style:normal;color:var(--primary);white-space:nowrap}
.home-intro p{max-width:670px;color:var(--ink-2);font-size:14.5px;line-height:1.85;font-weight:600}
.game-nav{
  display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding:3px 0 15px;
}
.game-nav::-webkit-scrollbar{display:none}
.nav-pill{
  flex:none;height:42px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:900;color:var(--ink-2);
  box-shadow:0 3px 10px rgba(37,75,57,.05);transition:all .2s var(--ease);
}
.nav-pill:hover{transform:translateY(-1px);border-color:rgba(40,122,88,.25)}
.nav-pill:active{transform:scale(.97)}
.nav-pill[aria-current="true"]{background:var(--primary);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(40,122,88,.2)}
.game-nav .nav-note{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;margin-left:4px}

/* Mind map */
.map{position:relative;padding:8px 0 28px}
.map-lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.map-lines path{fill:none;stroke:rgba(40,122,88,.28);stroke-width:2;stroke-linecap:round;stroke-dasharray:7 8}
.map-lines circle{fill:#7BB992}
.map-grid{
  position:relative;display:grid;grid-template-columns:minmax(0,1fr) 330px minmax(0,1fr);
  grid-template-rows:repeat(3,auto);gap:18px 46px;align-items:center;
}
.center-card{
  grid-column:2;grid-row:1 / span 3;justify-self:center;align-self:center;
  width:100%;max-width:330px;border-radius:var(--r-xl);padding:25px 23px 20px;color:#F5FFF8;
  background:#214D3B;
  box-shadow:0 26px 54px rgba(32,52,45,.25),inset 0 1px 0 rgba(255,255,255,.13);
  text-align:center;position:relative;overflow:hidden;
}
.center-card::after{
  content:"";position:absolute;left:20px;right:20px;bottom:16px;height:1px;background:rgba(255,255,255,.12);
}
.center-tag{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:900;letter-spacing:.08em;
  color:#CBE9D5;border:1px solid rgba(203,233,213,.36);padding:5px 10px;border-radius:999px;
}
.center-emoji{font-size:50px;line-height:1;margin:13px 0 4px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2))}
.center-grade{font-size:12px;font-weight:900;letter-spacing:.08em;color:#B7D8C4}
.center-card h2{font-size:31px;line-height:1.08;font-weight:900;letter-spacing:-.03em;margin:7px 0 5px}
.center-cn{font-size:12px;font-weight:700;color:#9FC6AE;letter-spacing:.12em}
.center-pills{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:14px}
.center-pills span{
  font-size:10.5px;font-weight:800;color:#D7EEE0;background:rgba(255,255,255,.09);
  padding:5px 8px;border-radius:999px;
}
.center-foot{
  margin-top:15px;padding-top:13px;border-top:1px dashed rgba(255,255,255,.15);
  display:flex;justify-content:center;gap:8px;font-size:10.5px;font-weight:700;color:#AACDB7;
}
.unit-card{
  position:relative;z-index:1;background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);
  box-shadow:var(--shadow);padding:14px 14px 12px;display:flex;flex-direction:column;gap:11px;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.unit-card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:5px;
  border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--a,var(--primary));opacity:.88;
}
.unit-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.uc-head{display:flex;align-items:center;gap:10px;margin-top:3px}
.uc-no{
  width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--as,var(--primary-soft));color:var(--a,var(--primary));
  font-size:11px;font-weight:900;
}
.uc-head h3{font-size:17px;line-height:1.2;font-weight:900;letter-spacing:-.01em}
.uc-head p{font-size:9.5px;font-weight:900;color:var(--muted);letter-spacing:.08em;margin-top:2px}
.uc-emoji{margin-left:auto;font-size:24px;line-height:1;filter:drop-shadow(0 3px 5px rgba(0,0,0,.07))}
.leaves{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.leaves.one{grid-template-columns:1fr}
.leaf{
  min-width:0;min-height:42px;padding:8px 9px;border-radius:12px;background:#FAFCF8;
  border:1px solid rgba(32,52,45,.07);display:flex;align-items:center;gap:7px;text-align:left;
  transition:background .2s,border-color .2s,transform .2s var(--ease);
}
.leaf:hover{background:var(--as,var(--primary-soft));border-color:rgba(40,122,88,.25);transform:translateY(-1px)}
.leaf:active{transform:scale(.97)}
.leaf .lf-emoji{font-size:16px;line-height:1;flex:none}
.leaf b{min-width:0;font-size:11.5px;font-weight:900;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaf i{
  font-style:normal;font-size:9.5px;font-weight:700;color:var(--muted);margin-left:auto;
  white-space:nowrap;max-width:48%;overflow:hidden;text-overflow:ellipsis;
}
.uc-foot{display:flex;align-items:center;gap:8px;margin-top:1px}
.uc-stars{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.05em}
.uc-go{
  margin-left:auto;padding:7px 11px;border-radius:999px;background:var(--as,var(--primary-soft));
  color:var(--a,var(--primary));font-size:11px;font-weight:900;transition:transform .2s var(--ease);
}
.uc-go:hover{transform:translateX(2px)}
.map-hint{display:none;text-align:center;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 12px}

/* Unit page */
.page-head{display:flex;align-items:flex-start;gap:18px;padding:8px 0 17px}
.back-btn{
  height:42px;padding:0 15px;border-radius:999px;background:#fff;border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:900;color:var(--ink-2);
  box-shadow:0 3px 10px rgba(37,75,57,.05);flex:none;margin-top:5px;
  transition:transform .2s var(--ease),background .2s;
}
.back-btn:hover{transform:translateX(-2px);background:#FCFDFB}
.head-main{flex:1;min-width:0}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--a,var(--primary));text-transform:uppercase}
.head-main h1{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 5px;
  font-size:34px;font-size:clamp(27px,3.5vw,40px);line-height:1.1;letter-spacing:-.03em;font-weight:900;
}
.head-main h1 span{font-size:13px;font-weight:900;color:var(--muted);letter-spacing:.03em}
.head-sub{font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.7}
.head-stars{
  flex:none;margin-top:5px;height:40px;padding:0 14px;border-radius:999px;
  background:var(--as,var(--primary-soft));color:var(--a,var(--primary));
  display:inline-flex;align-items:center;font-size:12px;font-weight:900;white-space:nowrap;
}
.unit-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.segmented{
  display:inline-flex;padding:4px;border-radius:999px;background:#fff;border:1px solid var(--line);gap:3px;
}
.seg-btn{
  height:42px;padding:0 19px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;font-weight:900;color:var(--muted);transition:all .23s var(--ease);
}
.seg-btn[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:0 6px 14px rgba(32,52,45,.17)}
.seg-btn:not([aria-selected="true"]):hover{background:#F5F8F3;color:var(--ink-2)}
.unit-toolbar .grow{flex:1}
.mini-note{font-size:11px;font-weight:800;color:var(--muted)}

/* Learn */
.caps-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:10px;scrollbar-width:none}
.caps-row::-webkit-scrollbar{display:none}
.cap{
  flex:none;height:36px;padding:0 13px;border-radius:999px;background:#fff;border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:900;color:var(--ink-2);
  transition:all .2s var(--ease);
}
.cap:hover{transform:translateY(-1px)}
.cap[aria-current="true"]{
  background:var(--as,var(--primary-soft));border-color:rgba(40,122,88,.24);color:var(--a,var(--primary));
}
.cap .cap-no{font-size:9.5px;opacity:.58}
.study-card{
  background:var(--card);border-radius:var(--r-xl);border:1px solid var(--line);box-shadow:var(--shadow);
  overflow:hidden;display:grid;grid-template-columns:.82fr 1.18fr;
}
.study-illus{
  position:relative;min-height:440px;padding:34px 24px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;background:var(--as,var(--primary-soft));
  border-right:1px solid var(--line);overflow:hidden;
}
.study-illus::before{
  content:"";position:absolute;left:14%;right:14%;bottom:35px;height:3px;
  background:rgba(32,52,45,.12);border-radius:999px;
}
.illus-sky{display:flex;align-items:flex-end;justify-content:center;gap:10px;position:relative;z-index:1}
.illus-sky .side{font-size:34px;font-size:clamp(28px,3.7vw,40px);opacity:.92;animation:floaty 5.6s ease-in-out infinite .5s}
.illus-sky .main{font-size:104px;font-size:clamp(84px,10vw,122px);line-height:1;filter:drop-shadow(0 14px 20px rgba(32,52,45,.14));animation:floaty 5s ease-in-out infinite}
.illus-sky .side:last-child{animation-delay:1s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.illus-word{
  position:relative;z-index:1;max-width:100%;font-size:38px;font-weight:900;letter-spacing:-.03em;
  text-align:center;line-height:1.0;color:var(--ink);background:#fff;border:1px solid rgba(32,52,45,.09);
  border-radius:18px;padding:13px 18px;box-shadow:0 8px 18px rgba(32,52,45,.07);
}
.illus-gloss{
  position:relative;z-index:1;font-size:11px;font-weight:900;color:var(--a,var(--primary));
  background:#fff;border:1px solid rgba(32,52,45,.08);padding:7px 12px;border-radius:999px;
}
.study-body{padding:32px 36px 28px;display:flex;flex-direction:column;gap:15px;min-width:0}
.leaf-count{font-size:10.5px;font-weight:900;letter-spacing:.11em;color:var(--muted)}
.word-row{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.word-row h2{font-size:38px;font-size:clamp(32px,4vw,48px);line-height:1.06;letter-spacing:-.03em;font-weight:900}
.word-row .phon{
  font-size:13px;font-weight:900;color:var(--a,var(--primary));background:var(--as,var(--primary-soft));
  padding:5px 9px;border-radius:8px;
}
.cn-meaning{font-size:13px;font-weight:800;color:var(--muted);margin-top:-7px}
.steps{counter-reset:step;display:grid;gap:11px;margin-top:4px}
.steps li{
  position:relative;counter-increment:step;padding-left:35px;font-size:14.5px;line-height:1.82;
  font-weight:600;color:var(--ink-2);
}
.steps li::before{
  content:counter(step);position:absolute;left:0;top:3px;width:24px;height:24px;
  border-radius:8px;display:grid;place-items:center;background:var(--as,var(--primary-soft));
  color:var(--a,var(--primary));font-size:10.5px;font-weight:900;
}
.tip-box,.example-box{
  border-radius:var(--r-md);padding:13px 15px;display:flex;gap:10px;align-items:flex-start;
  font-size:13px;line-height:1.72;font-weight:600;
}
.tip-box{background:#FFF6D8;color:#67510C}
.example-box{background:#EAF5FB;color:#25566D}
.tip-box .bx-ico,.example-box .bx-ico{font-size:17px;line-height:1.4;flex:none}
.bx-body b{display:block;font-size:10.5px;font-weight:900;letter-spacing:.1em;opacity:.72;margin-bottom:2px}
.study-nav{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.nav-btn{
  height:50px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:#fff;
  color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:13px;font-weight:900;transition:transform .2s var(--ease),box-shadow .2s,background .2s;
}
.nav-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 22px rgba(37,75,57,.09)}
.nav-btn:disabled{opacity:.38;cursor:not-allowed}
.nav-btn.primary{background:var(--primary);border-color:transparent;color:#fff;box-shadow:0 10px 24px rgba(40,122,88,.23)}
.nav-btn.primary:hover{background:var(--primary-d)}
.dots{display:flex;align-items:center;gap:6px;margin:0 auto}
.dot{width:7px;height:7px;border-radius:999px;background:rgba(32,52,45,.16);transition:all .3s var(--ease)}
.dot.on{width:24px;background:var(--a,var(--primary))}

/* Game common */
.game-intro{
  position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--shadow);padding:36px 38px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;
}
.gi-emoji{
  width:126px;height:126px;border-radius:32px;background:var(--as,var(--primary-soft));display:grid;place-items:center;
  font-size:60px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 10px 24px rgba(32,52,45,.06);
}
.gi-body{min-width:0}
.gi-type{font-size:10.5px;font-weight:900;letter-spacing:.12em;color:var(--a,var(--primary));text-transform:uppercase}
.gi-body h3{font-size:30px;font-size:clamp(26px,3.2vw,36px);line-height:1.12;font-weight:900;letter-spacing:-.02em;margin:6px 0 8px}
.gi-body p{font-size:13px;line-height:1.76;font-weight:600;color:var(--ink-2);max-width:670px}
.rules{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0 19px}
.rules li{font-size:10.5px;font-weight:800;color:var(--ink-2);background:#F6F9F4;border:1px solid var(--line);padding:7px 10px;border-radius:999px}
.start-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn-big{
  height:54px;padding:0 28px;border-radius:999px;background:var(--primary);color:#fff;
  display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:900;
  box-shadow:0 12px 26px rgba(40,122,88,.25);transition:transform .2s var(--ease),background .2s;
}
.btn-big:hover{transform:translateY(-2px);background:var(--primary-d)}
.btn-big:active{transform:scale(.97)}
.best-note{font-size:11.5px;font-weight:800;color:var(--muted)}
.game-shell{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:19px 21px 23px}
.game-hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.game-hud b{font-size:12.5px;font-weight:900;font-variant-numeric:tabular-nums}
.hud-score{font-size:11px;font-weight:900;color:var(--primary-d);background:var(--primary-soft);padding:5px 10px;border-radius:999px}
.hud-spacer{flex:1}
.hud-exit{font-size:10.5px;font-weight:800;color:var(--muted);background:#F5F8F3;padding:6px 10px;border-radius:999px}
.pbar{height:8px;border-radius:999px;background:#EDF2EB;overflow:hidden;margin-bottom:21px}
.pbar i{display:block;width:0;height:100%;border-radius:999px;background:linear-gradient(90deg,#79BF96,var(--primary));transition:width .42s var(--ease)}
.game-stage{min-height:420px;display:flex;flex-direction:column;justify-content:center}
.q-title{
  max-width:780px;margin:0 auto 4px;text-align:center;font-size:23px;font-size:clamp(19px,2.5vw,27px);
  line-height:1.38;font-weight:900;letter-spacing:-.02em;
}
.q-title .q-en{display:block;margin-top:7px;font-size:11px;font-weight:900;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
.q-sub{text-align:center;margin:6px 0 20px;font-size:12px;font-weight:700;color:var(--muted);line-height:1.55}
.game-feedback{text-align:center;margin-top:13px;min-height:22px;font-size:12.5px;font-weight:900}
.game-feedback.ok{color:var(--primary-d)}
.game-feedback.no{color:#A34732}

/* Assignment game */
.hat-wrap{max-width:850px;width:100%;margin:0 auto;display:grid;gap:20px}
.vowel-stand{
  justify-self:center;position:relative;min-width:230px;padding:24px 28px 20px;border-radius:26px;
  background:var(--as,var(--primary-soft));border:2px dashed rgba(40,122,88,.28);text-align:center;
}
.v-role{font-size:42px;line-height:1;margin-bottom:4px}
.v-letter{font-size:68px;line-height:1;font-weight:900;letter-spacing:-.03em}
.v-hint{font-size:11px;font-weight:800;color:var(--muted);margin-top:7px}
.hats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hat{
  min-height:92px;border-radius:18px;background:#FBFCFA;border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:all .2s var(--ease);
}
.hat:hover{transform:translateY(-3px);border-color:rgba(40,122,88,.3);box-shadow:0 10px 20px rgba(37,75,57,.07)}
.hat:active{transform:scale(.97)}
.hat .h-mark{font-size:30px;line-height:1;font-weight:900}
.hat .h-label{font-size:10px;font-weight:800;color:var(--muted)}
.hat.correct{border-color:var(--primary);background:var(--primary-soft);animation:pop .42s var(--ease)}
.hat.wrong{border-color:#E88977;background:#FFF0EC;animation:shake .42s}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* Placement game */
.place-wrap{max-width:900px;width:100%;margin:0 auto}
.place-command{
  width:max-content;max-width:100%;margin:0 auto 20px;padding:14px 20px;border-radius:20px;
  display:flex;align-items:center;gap:13px;background:#fff;border:2px solid var(--line);box-shadow:0 9px 22px rgba(37,75,57,.06);
}
.place-command .pc-emoji{font-size:38px;line-height:1}
.place-command b{display:block;font-size:22px;font-weight:900}
.place-command i{display:block;font-style:normal;font-size:10.5px;font-weight:800;color:var(--muted);margin-top:2px}
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.room{
  min-height:142px;padding:13px 9px;border-radius:19px;border:2px solid var(--line);background:#FAFCF8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:all .2s var(--ease);
}
.room:hover{transform:translateY(-3px);border-color:rgba(40,122,88,.3);box-shadow:0 10px 22px rgba(37,75,57,.07)}
.room .room-icon{font-size:31px;line-height:1}
.room b{font-size:12px;font-weight:900;text-align:center;line-height:1.35}
.room span{font-size:17px;font-weight:900;letter-spacing:.04em;color:var(--a,var(--primary))}
.room.correct{border-color:var(--primary);background:var(--primary-soft);animation:pop .42s var(--ease)}
.room.wrong{border-color:#E88977;background:#FFF0EC;animation:shake .42s}

/* Catch game */
.mole-field{max-width:840px;width:100%;margin:22px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.hole{position:relative;padding-top:5px}
.hole::after{
  content:"";position:absolute;left:8%;right:8%;bottom:0;height:20px;border-radius:50%;
  background:#CBDFC8;
}
.mole{
  position:relative;z-index:1;width:100%;margin-bottom:13px;padding:12px 8px 17px;border-radius:21px;
  background:#fff;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:5px;
  opacity:0;transform:translateY(24px);animation:rise .42s var(--ease) forwards;transition:border-color .2s,background .2s;
}
.mole:nth-child(2){animation-delay:.08s}
.mole:nth-child(3){animation-delay:.16s}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.mole .m-face{font-size:34px;line-height:1}
.mole .m-word{font-size:19px;font-weight:900;line-height:1.25}
.mole:hover{border-color:rgba(40,122,88,.34);background:#FBFEFB}
.mole.correct{border-color:var(--primary);background:var(--primary-soft)}
.mole.wrong{border-color:#E88977;background:#FFF0EC;animation:shake .42s}

/* Sort game */
.sort-wrap{max-width:920px;width:100%;margin:0 auto}
.card-tray{display:flex;justify-content:center;align-items:center;gap:11px;flex-wrap:wrap;min-height:94px;margin-bottom:18px}
.sort-card{
  min-width:82px;min-height:78px;padding:10px 12px;border-radius:17px;background:#fff;border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 5px 14px rgba(37,75,57,.05);
  transition:all .2s var(--ease);
}
.sort-card:hover{transform:translateY(-3px)}
.sort-card b{font-size:19px;line-height:1;font-weight:900}
.sort-card span{font-size:10px;font-weight:800;color:var(--muted)}
.sort-card.sel{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-6px) scale(1.04);box-shadow:0 14px 24px rgba(40,122,88,.18)}
.baskets{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.sort-basket{
  min-height:124px;padding:12px 8px 14px;border-radius:19px;background:#FBF9F2;border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;transition:all .2s var(--ease);
}
.sort-basket .b-ico{font-size:31px;line-height:1}
.sort-basket b{font-size:12px;font-weight:900;text-align:center}
.sort-basket span{font-size:9.5px;font-weight:800;color:var(--muted);text-align:center;line-height:1.35}
.sort-basket:hover{transform:translateY(-2px);border-color:rgba(40,122,88,.27)}
.sort-basket.hit{border-color:var(--primary);background:var(--primary-soft);animation:pop .42s var(--ease)}
.sort-basket.miss{border-color:#E88977;background:#FFF0EC;animation:shake .42s}

/* Build game */
.build-wrap{max-width:850px;width:100%;margin:0 auto}
.build-target{
  width:max-content;max-width:100%;margin:0 auto 18px;padding:16px 24px;border-radius:22px;
  background:#EAF5FB;border:2px solid #CDE6F1;text-align:center;
}
.build-target .bt-emoji{font-size:38px;line-height:1}
.build-target b{display:block;font-size:24px;font-weight:900;margin-top:4px}
.build-target span{display:block;font-size:10.5px;font-weight:800;color:#42728A;margin-top:3px}
.cloud-slots{min-height:84px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cloud-slot{
  min-width:84px;height:64px;padding:0 16px;border-radius:22px;border:2px dashed rgba(75,156,199,.35);
  background:#FAFDFE;display:grid;place-items:center;font-size:24px;font-weight:900;color:var(--ink-2);
}
.cloud-slot.filled{background:#E7F4FA;border-style:solid;border-color:#A8D5E6;color:#1E6282}
.cloud-pieces{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.cloud-piece{
  min-width:60px;height:48px;padding:0 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);
  font-size:18px;font-weight:900;box-shadow:0 3px 8px rgba(37,75,57,.05);transition:all .2s var(--ease);
}
.cloud-piece:hover{transform:translateY(-2px);border-color:#8FC9E0}
.cloud-piece.used{opacity:.22;pointer-events:none;transform:scale(.94)}
.build-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.tool-btn{
  height:38px;padding:0 15px;border-radius:999px;background:#F5F8F3;border:1px solid var(--line);
  font-size:11px;font-weight:900;color:var(--ink-2);
}
.tool-btn:hover{background:#EDF3EB}

/* Simulate game */
.sim-wrap{max-width:820px;width:100%;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:center}
.dial-panel{
  padding:20px;border-radius:25px;background:#F3F8FC;border:2px solid #D8E9F2;
  display:flex;flex-direction:column;align-items:center;gap:11px;
}
.tone-dial{position:relative;width:210px;height:210px;border-radius:50%;background:#fff;border:3px solid #CDE3EF;box-shadow:inset 0 0 0 9px #F6FBFD}
.dial-needle{
  position:absolute;left:50%;top:50%;width:4px;height:78px;border-radius:999px;background:var(--primary);
  transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);
  transition:transform .32s var(--ease);box-shadow:0 2px 7px rgba(40,122,88,.2);
}
.dial-needle::after{
  content:"";position:absolute;left:50%;bottom:-8px;width:18px;height:18px;border-radius:50%;
  transform:translateX(-50%);background:var(--primary);box-shadow:0 0 0 4px #fff;
}
.dial-btn{
  position:absolute;width:58px;height:58px;border-radius:50%;background:#F9FCFD;border:1.5px solid #CDE3EF;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:11px;font-weight:900;transition:all .2s var(--ease);
}
.dial-btn b{font-size:18px}
.dial-btn:hover{background:#EAF5FA;border-color:#8FC9E0}
.dial-btn.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 7px 15px rgba(40,122,88,.22)}
.dial-btn[data-tone="1"]{left:76px;top:6px}
.dial-btn[data-tone="2"]{right:6px;top:76px}
.dial-btn[data-tone="3"]{left:76px;bottom:6px}
.dial-btn[data-tone="4"]{left:6px;top:76px}
.dial-center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;
  display:grid;place-items:center;background:#EAF5FA;color:#23617F;font-size:10px;font-weight:900;text-align:center;
}
.dial-readout{font-size:12px;font-weight:900;color:#23617F}
.spell-panel{min-width:0}
.word-prompt{
  padding:16px 18px;border-radius:19px;background:#fff;border:2px solid var(--line);margin-bottom:15px;
  display:flex;align-items:center;gap:13px;
}
.word-prompt .wp-emoji{font-size:40px;line-height:1}
.word-prompt b{display:block;font-size:25px;font-weight:900}
.word-prompt span{display:block;font-size:10.5px;font-weight:800;color:var(--muted);margin-top:3px}
.spell-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spell-input{
  flex:1;min-width:140px;height:54px;padding:0 15px;border-radius:14px;border:2px solid var(--line);
  background:#fff;font:inherit;font-size:20px;font-weight:900;color:var(--ink);letter-spacing:.05em;
}
.spell-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(40,122,88,.1)}
.spell-hint{font-size:11px;font-weight:700;color:var(--muted);line-height:1.6;margin-top:10px}

/* Result */
.result{max-width:640px;margin:0 auto;padding:16px 10px 8px;text-align:center}
.r-emoji{font-size:66px;line-height:1;margin-bottom:10px}
.result h3{font-size:31px;font-size:clamp(27px,3.3vw,35px);line-height:1.12;font-weight:900;letter-spacing:-.03em}
.r-score{font-size:13.5px;font-weight:800;color:var(--muted);margin:8px 0 4px}
.stars-row{display:flex;justify-content:center;gap:10px;margin:18px 0 8px}
.star-slot{font-size:46px;line-height:1;filter:grayscale(1);opacity:.22;transform:scale(.8);transition:all .5s var(--ease)}
.star-slot.on{filter:none;opacity:1;transform:scale(1);animation:starPop .62s var(--ease)}
@keyframes starPop{0%{transform:scale(.2) rotate(-24deg)}62%{transform:scale(1.22) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
.r-msg{font-size:13px;line-height:1.78;font-weight:700;color:var(--ink-2);margin:7px 0 22px}
.result-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}

/* Modal and dashboard */
.modal-back{
  position:fixed;left:0;right:0;top:0;bottom:0;z-index:100;background:rgba(32,52,45,.35);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:830px;max-height:86vh;overflow:auto;background:#FBFAF6;border-radius:30px;
  box-shadow:0 36px 96px rgba(24,50,37,.32);padding:25px 27px 23px;animation:modalIn .32s var(--ease);
}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.975)}to{opacity:1;transform:none}}
.modal.verify{max-width:430px;text-align:center;padding:30px 25px 25px;position:relative}
.modal.verify .modal-close{position:absolute;top:12px;right:12px;margin:0}
.modal-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.modal-head h2{font-size:22px;font-weight:900;letter-spacing:-.02em}
.modal-head p{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.6;margin-top:4px}
.modal-close{
  margin-left:auto;width:36px;height:36px;border-radius:999px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;font-size:16px;flex:none;
}
.modal-close:hover{background:#F2F6F0}
.verify .v-ico{font-size:42px;line-height:1;margin-bottom:7px}
.verify h2{font-size:22px;font-weight:900;letter-spacing:-.02em}
.verify p{font-size:12px;font-weight:700;color:var(--muted);line-height:1.72;margin:8px 0 17px}
.verify-q{font-size:32px;font-weight:900;letter-spacing:.02em;margin-bottom:14px}
.verify-row{display:flex;justify-content:center;gap:8px}
.num-input{
  width:116px;height:54px;border-radius:14px;border:2px solid var(--line);background:#fff;
  text-align:center;color:var(--ink);font:inherit;font-size:23px;font-weight:900;
}
.num-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(40,122,88,.1)}
.verify-err{min-height:20px;margin-top:10px;font-size:11.5px;font-weight:900;color:#A34732}
.dash-overview{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:19px}
.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 13px 12px}
.stat span{display:block;font-size:10px;font-weight:900;letter-spacing:.06em;color:var(--muted)}
.stat b{display:block;font-size:22px;font-weight:900;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat b small{font-size:10.5px;color:var(--muted);font-weight:800;margin-left:4px}
.dash-sub{display:flex;align-items:center;gap:10px;margin:5px 0 10px;flex-wrap:wrap}
.dash-sub h3{font-size:13px;font-weight:900}
.dash-sub span{font-size:10.5px;font-weight:700;color:var(--muted)}
.dash-table{width:100%;border-collapse:collapse;background:#fff;border-radius:15px;overflow:hidden}
.dash-table th{
  padding:10px 11px;text-align:left;background:#F6F9F4;border-bottom:1px solid var(--line);
  font-size:9.5px;font-weight:900;letter-spacing:.04em;color:var(--muted);white-space:nowrap;
}
.dash-table td{padding:10px 11px;border-bottom:1px solid rgba(32,52,45,.06);font-size:11.5px;font-weight:700;white-space:nowrap}
.dash-table tr:last-child td{border-bottom:0}
.dash-table .u-name{font-weight:900}
.dash-table .u-en{display:block;font-size:9px;font-weight:800;color:var(--muted);margin-top:1px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900}
.b-3{background:#DFF1E3;color:#1D6042}
.b-2{background:#FFF1CB;color:#82600E}
.b-1{background:#E7F2F9;color:#2E6784}
.b-0{background:#F1F3F0;color:#788A80}
.dash-list{display:none;gap:8px}
.dash-item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 13px}
.di-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.di-top b{font-size:12.5px;font-weight:900}
.di-top .badge{margin-left:auto}
.di-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:10.5px;font-weight:700;color:var(--muted)}
.di-grid b{color:var(--ink);font-weight:900}
.dash-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:17px}
.dash-note{max-width:430px;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.6}
.clear-btn{
  height:42px;padding:0 16px;border-radius:999px;background:#FFF0EC;border:1px solid #F0CEC6;
  color:#A34732;font-size:11.5px;font-weight:900;transition:all .2s;
}
.clear-btn.armed{background:#A34732;border-color:#A34732;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(163,71,50,.32)}50%{box-shadow:0 0 0 8px rgba(163,71,50,0)}}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.help-item{padding:13px 14px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.help-item b{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:900}
.help-item p{margin-top:5px;font-size:11px;line-height:1.65;font-weight:600;color:var(--ink-2)}
.help-tip{margin-top:12px;padding:12px 14px;border-radius:15px;background:#FFF6D8;color:#67510C;font-size:11px;font-weight:700;line-height:1.65}

.toast{
  position:fixed;left:50%;bottom:calc(var(--bottom) + 18px);z-index:120;max-width:88vw;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;background:rgba(32,52,45,.94);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:12px;font-weight:900;text-align:center;
  box-shadow:0 10px 28px rgba(0,0,0,.18);transition:all .28s var(--ease);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;left:0;top:0;width:100%;height:100%;z-index:110;pointer-events:none}

/* Responsive */
@media (max-width:1080px){
  .map-grid{grid-template-columns:minmax(0,1fr) 286px minmax(0,1fr);gap:19px 28px}
  .center-card{padding:23px 19px 20px}
  .study-body{padding:27px 28px 25px}
}
@media (max-width:1100px){
  .map-hint{display:block}
  .map-grid{display:flex;flex-direction:column;gap:13px;align-items:stretch}
  .map-lines{display:none}
  .center-card{
    max-width:none;display:grid;grid-template-columns:auto 1fr;gap:3px 16px;text-align:left;padding:22px;
  }
  .center-card::after{display:none}
  .center-tag{grid-column:1 / -1;justify-self:start}

/* ================= 存档 ================= */
const STORE_KEY = "youyou_pinyin_grade1_v1";
const DEFAULT_STORE = {
  stars: {}, plays: {}, best: {}, last: {}, totalGames: 0, lastStudy: 0, sound: true
};
let storageOK = true;

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STORE));
    const saved = JSON.parse(raw) || {};
    return {
      stars: saved.stars || {},
      plays: saved.plays || {},
      best: saved.best || {},
      last: saved.last || {},
      totalGames: saved.totalGames || 0,
      lastStudy: saved.lastStudy || 0,
      sound: saved.sound !== false
    };
  } catch (error) {
    storageOK = false;
    return JSON.parse(JSON.stringify(DEFAULT_STORE));
  }
}

function saveStore() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  } catch (error) {
    storageOK = false;
  }
}

let store = loadStore();

/* ================= 音效 ================= */
let audioContext = null;
function getAudioContext() {
  if (!store.sound) return null;
  try {
    if (!audioContext) {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return null;
      audioContext = new AudioCtor();
    }
    if (audioContext.state === "suspended") audioContext.resume();
    return audioContext;
  } catch (error) {
    return null;
  }
}

function beep(frequency, duration = 0.12, type = "sine", volume = 0.07, delay = 0) {
  const context = getAudioContext();
  if (!context) return;
  const oscillator = context.createOscillator();
  const gain = context.createGain();
  oscillator.type = type;
  oscillator.frequency.value = frequency;
  const start = context.currentTime + delay;
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.linearRampToValueAtTime(volume, start + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  oscillator.connect(gain);
  gain.connect(context.destination);
  oscillator.start(start);
  oscillator.stop(start + duration + 0.03);
}

};

const app = document.getElementById("app");

const toastEl = document.getElementById("toast");
let toastTimer = null;

function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2100);
}

function esc(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function shuffle(items) {
  const copy = items.slice();
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function fmtTime(timestamp) {
  if (!timestamp) return "还没开始";
  const date = new Date(timestamp);
  const now = new Date();
  const sameDay = date.toDateString() === now.toDateString();
  const hh = String(date.getHours()).padStart(2, "0");
  const mm = String(date.getMinutes()).padStart(2, "0");
  if (sameDay) return "今天 " + hh + ":" + mm;
  return (date.getMonth() + 1) + "月" + date.getDate() + "日 " + hh + ":" + mm;
}

function starLevel(correct, total) {
  if (correct >= Math.ceil(total * 0.85)) return 3;
  if (correct >= Math.ceil(total * 0.65)) return 2;
  return 1;
}

function mastery(unitId) {
  const stars = store.stars[unitId] || 0;
  if (stars >= 3) return ["已掌握", "b-3"];
  if (stars === 2) return ["基本掌握", "b-2"];
  if (stars === 1) return ["初步接触", "b-1"];
  return ["还没开始", "b-0"];
}

function setAccent(unit) {
  app.style.setProperty("--a", unit ? unit.accent : "#287A58");
  app.style.setProperty("--as", unit ? unit.soft : "#E3F2E7");
}

function paintTopStars(pop) {
  document.getElementById("starTotal").textContent = totalStars();
  if (pop) {
    const chip = document.getElementById("starChip");
    chip.classList.remove("pop");
    void chip.offsetWidth;
    chip.classList.add("pop");
  }
}

function route() {
  const raw = location.hash.replace(/^#\/?/, "");
  const parts = raw.split("/").filter(Boolean);
  if (parts[0] === "unit" && parts[1]) {
    const unit = unitOf(parts[1]);
    if (unit) {
      const tab = parts[2] === "game" ? "game" : "study";
      let index = parseInt(parts[3], 10);
      if (Number.isNaN(index) || index < 0 || index >= unit.points.length) index = 0;
      return { name: "unit", unit, tab, index };
    }
  }
  return { name: "home" };
}

function go(hash) {
  const target = "#" + hash;
  if (location.hash === target) render();
  else location.hash = target;
}

function render() {
  const current = route();
  closeModal();
  if (current.name === "home") renderHome();
  else renderUnit(current.unit, current.tab, current.index);
  paintTopStars(false);
  window.scrollTo({ top: 0, behavior: "auto" });
}

  gameState = null;
  render();
});

function drawMapLines() {
  const map = document.getElementById("map");
  const svg = document.getElementById("mapLines");
  const center = document.getElementById("mapCenter");
  if (!map || !svg || !center) return;
  if (window.innerWidth <= 900) {
    svg.innerHTML = "";
    return;
  }
  const mapRect = map.getBoundingClientRect();
  const centerRect = center.getBoundingClientRect();
  const startLeft = centerRect.left - mapRect.left;
  const startTop = centerRect.top - mapRect.top;
  const centerX = startLeft + centerRect.width / 2;
  let paths = "";
  UNITS.forEach(unit => {
    const card = map.querySelector(`[data-card="${unit.id}"]`);
    if (!card) return;
    const rect = card.getBoundingClientRect();
    const x = rect.left - mapRect.left;
    const y = rect.top - mapRect.top;
    const fromLeft = x + rect.width / 2 < centerX;
    const sx = fromLeft ? startLeft : startLeft + centerRect.width;
    const sy = Math.max(startTop + 28, Math.min(startTop + centerRect.height - 28, y + rect.height / 2));
    const ex = fromLeft ? x + rect.width : x;
    const ey = y + rect.height / 2;
    const midX = (sx + ex) / 2;
    paths += `<path d="M${sx.toFixed(1)} ${sy.toFixed(1)} C${midX.toFixed(1)} ${sy.toFixed(1)}, ${midX.toFixed(1)} ${ey.toFixed(1)}, ${ex.toFixed(1)} ${ey.toFixed(1)}"/>`;
    paths += `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3.4"/>`;
  });
  svg.setAttribute("viewBox", `0 0 ${mapRect.width} ${mapRect.height}`);
  svg.innerHTML = paths;
}

/* ================= 题目生成 ================= */
const TONE_MARKS = {
  a: ["ā", "á", "ǎ", "à"],
  o: ["ō", "ó", "ǒ", "ò"],
  e: ["ē", "é", "ě", "è"],
  i: ["ī", "í", "ǐ", "ì"],
  u: ["ū", "ú", "ǔ", "ù"],
  ü: ["ǖ", "ǘ", "ǚ", "ǜ"]
};

const VOWEL_ROLES = {
  a: { face: "🧒", name: "小 a" },
  o: { face: "🐓", name: "小 o" },
  e: { face: "🦢", name: "小 e" },
  i: { face: "👕", name: "小 i" },
  u: { face: "🐦‍⬛", name: "小 u" },
  ü: { face: "🐟", name: "小 ü" }
};

const INITIAL_GROUPS = [
  { label: "双唇组", detail: "b p m f", icon: "👄", note: "嘴唇先动" },
  { label: "舌尖组", detail: "d t n l", icon: "👅", note: "舌尖顶上牙床" },
  { label: "舌根组", detail: "g k h", icon: "🌬️", note: "舌根往后靠" },
  { label: "舌面组", detail: "j q x", icon: "😄", note: "舌面靠近上颚" }
];
const INITIAL_TO_GROUP = {
  b: 0, p: 0, m: 0, f: 0,
  d: 1, t: 1, n: 1, l: 1,
  g: 2, k: 2, h: 2,
  j: 3, q: 3, x: 3
};

function makeQuestions(unit) {
  if (unit.game.type === "assign") {
    const plan = [
      ["a", 1], ["o", 2], ["e", 3], ["i", 4], ["u", 2],
      ["ü", 3], ["a", 4], ["o", 1], ["e", 2]
    ];
    return plan.map(([letter, tone]) => ({
      letter,
      tone,
      role: VOWEL_ROLES[letter],
      options: TONE_MARKS[letter].map((mark, index) => ({ mark, tone: index + 1 }))
    }));
  }

  if (unit.game.type === "place") {
    const initials = ["b", "t", "k", "q", "m", "n", "h", "x", "p"];
    return initials.map(initial => ({
      initial,
      correctGroup: INITIAL_TO_GROUP[initial],
      groups: INITIAL_GROUPS
    }));
  }

  if (unit.game.type === "catch") {
    const list = [
      ["哪只地鼠举着平舌音 z？", "z", ["zh", "j"]],
      ["“狮子”开头的声母是哪一个？", "sh", ["s", "ch"]],
      ["哪只地鼠举着翘舌音 ch？", "ch", ["c", "q"]],
      ["“衣服”开头的音节是哪一个？", "yi", ["wu", "yu"]],
      ["哪只地鼠举着整体认读音节 zhi？", "zhi", ["zh", "z"]],
      ["“热”开头的声母是哪一个？", "r", ["l", "n"]],
      ["哪只地鼠举着平舌音 s？", "s", ["sh", "x"]],
      ["“鱼”开头的音节是哪一个？", "yu", ["wu", "yi"]],
      ["哪只地鼠举着翘舌音 sh？", "sh", ["s", "r"]]
    ];
    return list.map(([prompt, answer, wrong]) => ({
      prompt,
      options: shuffle([{ text: answer, ok: true }, ...wrong.map(text => ({ text, ok: false }))])
    }));
  }

  if (unit.game.type === "sort") {
    return [
      { text: "ai", kind: "compound", group: "复韵母" },
      { text: "zhi", kind: "whole", group: "整体认读" },
      { text: "er", kind: "special", group: "特殊韵母" },
      { text: "ei", kind: "compound", group: "复韵母" },
      { text: "yue", kind: "whole", group: "整体认读" },
      { text: "üe", kind: "compound", group: "复韵母" },
      { text: "yuan", kind: "whole", group: "整体认读" },
      { text: "ui", kind: "compound", group: "复韵母" },
      { text: "ying", kind: "whole", group: "整体认读" }
    ];
  }

  if (unit.game.type === "build") {
    return [
      { emoji: "🐑", cn: "小羊 yáng", hint: "先看音节，再找它的鼻韵母", parts: ["a", "ng"], pieces: ["a", "ng", "n"] },
      { emoji: "🚪", cn: "门 mén", hint: "先看音节，再找它的鼻韵母", parts: ["e", "n"], pieces: ["e", "n", "ng"] },
      { emoji: "❤️", cn: "心 xīn", hint: "先看音节，再找它的鼻韵母", parts: ["i", "n"], pieces: ["i", "n", "ng"] },
      { emoji: "🌱", cn: "春 chūn", hint: "先看音节，再找它的鼻韵母", parts: ["u", "n"], pieces: ["u", "n", "ng"] },
      { emoji: "🪖", cn: "军 jūn", hint: "先看音节，再找它的鼻韵母", parts: ["ü", "n"], pieces: ["ü", "u", "n"] },
      { emoji: "🏮", cn: "灯 dēng", hint: "先看音节，再找它的鼻韵母", parts: ["e", "ng"], pieces: ["e", "ng", "n"] },
      { emoji: "⭐", cn: "星 xīng", hint: "先看音节，再找它的鼻韵母", parts: ["i", "ng"], pieces: ["i", "ng", "n"] },
      { emoji: "🔔", cn: "钟 zhōng", hint: "先看音节，再找它的鼻韵母", parts: ["o", "ng"], pieces: ["o", "ng", "n"] },
      { emoji: "🤝", cn: "帮 bāng", hint: "先看音节，再找它的鼻韵母", parts: ["a", "ng"], pieces: ["a", "ng", "n"] }
    ];
  }

  if (unit.game.type === "simulate") {
    return [
      { emoji: "🌼", cn: "花", letters: "hua", tone: 1 },
      { emoji: "💧", cn: "水", letters: "shui", tone: 3 },
      { emoji: "☁️", cn: "云", letters: "yun", tone: 2 },
      { emoji: "🐘", cn: "大", letters: "da", tone: 4 },
      { emoji: "📚", cn: "学", letters: "xue", tone: 2 },
      { emoji: "🌱", cn: "春", letters: "chun", tone: 1 },
      { emoji: "🌧️", cn: "雨", letters: "yu", tone: 3 },
      { emoji: "🚶", cn: "去", letters: "qu", tone: 4 },
      { emoji: "🐱", cn: "猫", letters: "mao", tone: 1 }
    ];
  }

  return [];
}

function startRun(unit) {
  gameState = {
    unitId: unit.id,
    type: unit.game.type,
    questions: makeQuestions(unit),
    index: 0,
    correct: 0,
    locked: false,
    done: false,
    selected: null,
    slots: [],
    tileOrder: [],
    dialTone: 0
  };

  paintTopStars(false);
}

function renderGamePanel(unit) {
  const panel = document.getElementById("panel");
  if (gameState && gameState.unitId === unit.id && !gameState.done) {

    renderGamePanel(unit);
  });
  if (state.index >= total) {
    finishGame(unit);
    return;
  }
  const renderers = {
    assign: renderAssign,
    place: renderPlace,
    catch: renderCatch,
    sort: renderSort,
    build: renderBuild,
    simulate: renderSimulate
  };
  renderers[state.type](unit);
}

function advance(unit, ok) {
  const state = gameState;
  if (ok) state.correct += 1;
  state.locked = true;
  state.index += 1;
  const stage = document.getElementById("stage");
  const feedback = document.createElement("div");
  feedback.className = "game-feedback " + (ok ? "ok" : "no");
  feedback.textContent = ok ? "答对啦！" : "看一遍提示，下一题继续加油。";
  if (stage) stage.appendChild(feedback);
  setTimeout(() => {
    if (!gameState || gameState !== state) return;
    if (state.index >= state.questions.length) {
      finishGame(unit);
    } else {
      state.locked = false;
      state.selected = null;
      state.slots = [];
      state.tileOrder = [];
      state.dialTone = 0;
      renderGameStage(unit);
    }
  }, ok ? 760 : 1450);
}

function renderBuild(unit) {
  const state = gameState;
  const question = state.questions[state.index];
  const stage = document.getElementById("stage");
  if (!state.tileOrder.length) state.tileOrder = shuffle(question.pieces.map((_, index) => index));
  if (state.slots.length !== question.parts.length) state.slots = new Array(question.parts.length).fill(null);

  stage.innerHTML = `
    <h2 class="q-title">拼出 ${esc(question.cn)} 的韵母<span class="q-en">Tap clouds to build the final</span></h2>
    <p class="q-sub" id="gameLine">点下面两块云朵零件，拼满会自动检查。点已放好的云朵可以退回。</p>
    <div class="build-wrap">
      <div class="build-target">
        <div class="bt-emoji" aria-hidden="true">${question.emoji}</div>
        <b>${esc(question.cn)}</b>
        <span>${esc(question.hint)}</span>
      </div>
      <div class="cloud-slots">
        ${state.slots.map((slot, index) => `<button class="cloud-slot ${slot === null ? "" : "filled"}" type="button" data-slot="${index}">${slot === null ? "?" : esc(slot)}</button>`).join("")}
      </div>
      <div class="cloud-pieces">
        ${state.tileOrder.map(index => {
          const piece = question.pieces[index];
          const used = state.slots.includes(piece);
          return `<button class="cloud-piece ${used ? "used" : ""}" type="button" data-piece="${index}">${esc(piece)}</button>`;
        }).join("")}
      </div>
      <div class="build-actions"><button class="tool-btn" type="button" id="resetBuild">清空重来</button></div>
    </div>`;

  const check = () => {
    if (state.locked || state.slots.some(item => item === null)) return;
    const ok = state.slots.join("") === question.parts.join("");
    if (ok) sfx.correct();
    else sfx.wrong();
    document.getElementById("gameLine").textContent = ok
      ? `拼对啦！韵母是 ${question.parts.join("")}。`
      : `正确韵母是 ${question.parts.join("")}。`;
    advance(unit, ok);
  };

  stage.querySelectorAll("[data-piece]").forEach(button => button.addEventListener("click", () => {
    if (state.locked) return;
    const index = Number(button.dataset.piece);
    const piece = question.pieces[index];
    if (state.slots.includes(piece)) return;
    const empty = state.slots.indexOf(null);
    if (empty === -1) return;
    state.slots[empty] = piece;
    sfx.click();
    if (state.slots.every(item => item !== null)) {
      renderBuild(unit);
      setTimeout(check, 140);
      return;
    }
    renderBuild(unit);
  }));
  stage.querySelectorAll("[data-slot]").forEach(button => button.addEventListener("click", () => {
    if (state.locked) return;
    const index = Number(button.dataset.slot);
    if (state.slots[index] === null) return;
    state.slots[index] = null;
    sfx.click();
    renderBuild(unit);
  }));
  const reset = document.getElementById("resetBuild");
  reset.addEventListener("click", () => {
    if (state.locked) return;
    state.slots = state.slots.map(() => null);
    sfx.click();
    renderBuild(unit);
  });
}

function normalizeSpelling(value) {
  return String(value)
    .trim()
    .toLowerCase()
    .replace(/ü/g, "v")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, "")
    .replace(/v/g, "ü");
}

  const state = gameState;

  const stage = document.getElementById("stage");

          <button class="nav-btn primary" type="button" id="spellOk">确认</button>
        </div>

      </div>
    </div>`;

  const needle = document.getElementById("dialNeedle");
  const readout = document.getElementById("dialReadout");
  const rotations = { 1: 0, 2: 90, 3: 180, 4: 270 };
  stage.querySelectorAll("[data-tone]").forEach(button => button.addEventListener("click", () => {
    if (state.locked) return;
    state.dialTone = Number(button.dataset.tone);
    needle.style.transform = `translate(-50%,-100%) rotate(${rotations[state.dialTone]}deg)`;
    stage.querySelectorAll("[data-tone]").forEach(item => item.classList.toggle("on", Number(item.dataset.tone) === state.dialTone));
    readout.textContent = `已选择第 ${state.dialTone} 声`;
    beep(360 + state.dialTone * 55, 0.07, "sine", 0.032);
  }));

  const submit = () => {
    if (state.locked) return;
    const typed = normalizeSpelling(document.getElementById("spellInput").value);
    const expected = normalizeSpelling(question.letters);
    const ok = state.dialTone === question.tone && typed === expected;
    if (ok) sfx.correct();
    else sfx.wrong();
    document.getElementById("gameLine").textContent = ok
      ? `调对啦！${question.cn} 是第 ${question.tone} 声，字母是 ${question.letters}。`
      : `正确是第 ${question.tone} 声，字母 ${question.letters}。`;
    advance(unit, ok);
  };
  document.getElementById("spellOk").addEventListener("click", submit);
  document.getElementById("spellInput").addEventListener("keydown", event => {
    if (event.key === "Enter") submit();
  });
}

/* ================= 结算 ================= */
function finishGame(unit) {
  const state = gameState;
  const total = state.questions.length;
  const stars = starLevel(state.correct, total);
  const accuracy = Math.round((state.correct / total) * 100);
  state.done = true;
  state.stars = stars;
  state.accuracy = accuracy;

  store.plays[unit.id] = (store.plays[unit.id] || 0) + 1;
  store.totalGames = (store.totalGames || 0) + 1;
  store.best[unit.id] = Math.max(store.best[unit.id] || 0, accuracy);
  store.stars[unit.id] = Math.max(store.stars[unit.id] || 0, stars);
  store.last[unit.id] = {
    accuracy,
    correct: state.correct,
    total,
    timestamp: Date.now()
  };
  store.lastStudy = Date.now();
  saveStore();
  if (!storageOK) toast("浏览器没有允许保存，记录只会保留在本页");
  paintTopStars(true);
  const headStars = document.querySelector(".head-stars");
  if (headStars) headStars.textContent = `⭐ ${store.stars[unit.id] || 0}/3`;
  if (stars >= 2) {
    sfx.win();
    celebrate();
  } else {
    sfx.star();
  }
  renderGameResult(unit);
}

/* ================= 撒花 ================= */
const confettiCanvas = document.getElementById("confettiCanvas");
const confettiContext = confettiCanvas.getContext("2d");
let confettiPieces = [];
let confettiFrame = null;

function sizeConfetti() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  confettiCanvas.width = Math.floor(window.innerWidth * ratio);
  confettiCanvas.height = Math.floor(window.innerHeight * ratio);
  confettiCanvas.style.width = window.innerWidth + "px";
  confettiCanvas.style.height = window.innerHeight + "px";
  confettiContext.setTransform(ratio, 0, 0, ratio, 0, 0);
}
sizeConfetti();

const CONFETTI_COLORS = ["#287A58", "#F2BE3E", "#E96C54", "#4B9CC7", "#E8A1B5", "#8BC99E", "#F08C52"];
function celebrate() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const width = window.innerWidth;
  const height = window.innerHeight;
  confettiPieces = Array.from({ length: 135 }, () => ({
    x: width / 2 + (Math.random() - 0.5) * width * 0.45,
    y: height * 0.3 + (Math.random() - 0.5) * 70,
    vx: (Math.random() - 0.5) * 9,
    vy: -Math.random() * 11 - 4,
    gravity: 0.24 + Math.random() * 0.12,
    width: 6 + Math.random() * 8,
    height: 4 + Math.random() * 6,
    rotation: Math.random() * Math.PI,
    rotationSpeed: (Math.random() - 0.5) * 0.35,
    color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
    life: 1
  }));
  cancelAnimationFrame(confettiFrame);
  const start = performance.now();
  const tick = now => {
    const elapsed = now - start;
    confettiContext.clearRect(0, 0, width, height);
    confettiPieces.forEach(piece => {
      piece.vy += piece.gravity;
      piece.x += piece.vx;
      piece.y += piece.vy;
      piece.rotation += piece.rotationSpeed;
      piece.vx *= 0.995;
      if (elapsed > 1600) piece.life -= 0.012;
      confettiContext.save();
      confettiContext.globalAlpha = Math.max(0, piece.life);
      confettiContext.translate(piece.x, piece.y);
      confettiContext.rotate(piece.rotation);
      confettiContext.fillStyle = piece.color;
      confettiContext.fillRect(-piece.width / 2, -piece.height / 2, piece.width, piece.height);
      confettiContext.restore();
    });
    if (elapsed < 3600) confettiFrame = requestAnimationFrame(tick);
    else confettiContext.clearRect(0, 0, width, height);
  };
  confettiFrame = requestAnimationFrame(tick);
}

          <div class="help-item"><b>🧺 归类型</b><p>先点拼音卡，再点复韵母、特殊韵母或整体认读果篮。</p></div>
          <div class="help-item"><b>☁️ 建构型</b><p>点击云朵零件，拼出题目需要的鼻韵母。</p></div>
          <div class="help-item"><b>🎛️ 操作模拟型</b><p>拨动声调盘，再用键盘输入不带调号的拼音字母。</p></div>
        </div>
        <div class="help-tip">每局 9 题。答对 8 至 9 题得 3 星，答对 6 至 7 题得 2 星，其余得 1 星。2 星以上会出现撒花庆祝。</div>
      </div>
    </div>`;
  document.getElementById("helpClose").addEventListener("click", closeModal);
  document.getElementById("modalBack").addEventListener("click", event => {
    if (event.target.id === "modalBack") closeModal();
  });
}

function openParent() {
  sfx.click();
  modalRoot.innerHTML = `
    <div class="modal-back" id="modalBack">
      <div class="modal verify" role="dialog" aria-modal="true" aria-labelledby="verifyTitle">
        <button class="modal-close" type="button" id="verifyClose" aria-label="关闭">✕</button>
        <div class="v-ico" aria-hidden="true">🔒</div>
        <h2 id="verifyTitle">家长验证</h2>
        <p>请回答下面这道题，验证通过后才能进入家长中心。<br>防止小朋友误点。</p>
        <div class="verify-q">7 × 8 = ?</div>
        <div class="verify-row">
          <input class="num-input" id="verifyInput" type="number" inputmode="numeric" placeholder="?" aria-label="验证答案">
          <button class="nav-btn primary" type="button" id="verifyOk">进入</button>
        </div>
        <div class="verify-err" id="verifyErr"></div>
      </div>
    </div>`;
  const input = document.getElementById("verifyInput");
  const error = document.getElementById("verifyErr");
  const submit = () => {
    if (parseInt(input.value, 10) === 56) {
      sfx.correct();
      openDashboard();
    } else {
      sfx.wrong();
      error.textContent = "答案不对，请再算一次。";
      input.value = "";
      input.focus();
    }
  };
  document.getElementById("verifyOk").addEventListener("click", submit);
  document.getElementById("verifyClose").addEventListener("click", closeModal);
  document.getElementById("modalBack").addEventListener("click", event => {
    if (event.target.id === "modalBack") closeModal();
  });
  input.addEventListener("keydown", event => {
    if (event.key === "Enter") submit();
  });
  setTimeout(() => input.focus(), 60);
}

function openDashboard() {
  const total = totalStars();
  const rows = UNITS.map(unit => {
    const stars = store.stars[unit.id] || 0;
    const best = store.best[unit.id] || 0;
    const last = store.last[unit.id];
    const level = mastery(unit.id);
    return `<tr>
      <td><span class="u-name">${esc(unit.title)}</span><span class="u-en">${esc(unit.en)}</span></td>
      <td>${starsTxt(stars)}</td>
      <td>${store.plays[unit.id] || 0} 次</td>
      <td>${store.plays[unit.id] ? best + "%" : "暂无"}</td>
      <td>${last ? `${last.correct}/${last.total} · ${fmtTime(last.timestamp)}` : "暂无"}</td>
      <td><span class="badge ${level[1]}">${level[0]}</span></td>
    </tr>`;
  }).join("");
  const cards = UNITS.map(unit => {
    const stars = store.stars[unit.id] || 0;
    const best = store.best[unit.id] || 0;
    const last = store.last[unit.id];
    const level = mastery(unit.id);
    return `<div class="dash-item">
      <div class="di-top"><b>${esc(unit.title)}</b><span class="badge ${level[1]}">${level[0]}</span></div>
      <div class="di-grid">
        <span>星星 <b>${starsTxt(stars)}</b></span>
        <span>玩过 <b>${store.plays[unit.id] || 0} 次</b></span>
        <span>最佳 <b>${store.plays[unit.id] ? best + "%" : "暂无"}</b></span>
        <span>最近 <b>${last ? `${last.correct}/${last.total}` : "暂无"}</b></span>
      </div>
    </div>`;
  }).join("");
  modalRoot.innerHTML = `
    <div class="modal-back" id="modalBack">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dashTitle">
        <div class="modal-head">
          <div>
            <h2 id="dashTitle">家长中心</h2>
            <p>记录保存在这台设备的浏览器里。换浏览器或清理网站数据后会重新开始。</p>
          </div>
          <button class="modal-close" type="button" id="dashClose" aria-label="关闭">✕</button>
        </div>
        <div class="dash-overview">
          <div class="stat"><span>总星星</span><b>${total}<small>/ 18</small></b></div>
          <div class="stat"><span>已闯关单元</span><b>${playedUnits()}<small>/ 6</small></b></div>
          <div class="stat"><span>游戏总次数</span><b>${store.totalGames || 0}<small>次</small></b></div>
          <div class="stat"><span>最近学习时间</span><b style="font-size:14px;line-height:1.5;margin-top:8px">${fmtTime(store.lastStudy)}</b></div>
        </div>
        <div class="dash-sub"><h3>单元明细</h3><span>掌握情况按历史最高星级判断</span></div>
        <table class="dash-table">
          <thead><tr><th>单元</th><th>星星</th><th>玩过</th><th>最佳正确率</th><th>最近成绩</th><th>掌握情况</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="dash-list">${cards}</div>
        <div class="dash-foot">
          <p class="dash-note">建议每天学习 8 至 12 分钟。星星只升不降，孩子可以放心重复挑战。</p>
          <button class="clear-btn" type="button" id="clearBtn">清空所有记录</button>
        </div>
      </div>
    </div>`;
  document.getElementById("dashClose").addEventListener("click", closeModal);
  document.getElementById("modalBack").addEventListener("click", event => {
    if (event.target.id === "modalBack") closeModal();
  });

  const clearButton = document.getElementById("clearBtn");
  let armed = false;
  let armTimer = null;
  clearButton.addEventListener("click", () => {
    if (!armed) {
      armed = true;
      clearButton.classList.add("armed");
      clearButton.textContent = "再点一次，确认清空";
      armTimer = setTimeout(() => {
        armed = false;
        clearButton.classList.remove("armed");
        clearButton.textContent = "清空所有记录";
      }, 5000);
      return;
    }
    clearTimeout(armTimer);
    store = JSON.parse(JSON.stringify(DEFAULT_STORE));
    saveStore();
    gameState = null;
    paintTopStars(false);
    closeModal();
    toast("学习记录已清空");
    render();
  });
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && modalRoot.innerHTML) closeModal();
});

/* ================= 顶栏与启动 ================= */
document.getElementById("brandHome").addEventListener("click", () => {
  sfx.click();
  go("/");
});
document.getElementById("parentBtn").addEventListener("click", openParent);

const soundButton = document.getElementById("soundBtn");
function syncSoundButton() {
  soundButton.setAttribute("aria-pressed", String(Boolean(store.sound)));
  document.getElementById("soundIcon").textContent = store.sound ? "🔊" : "🔇";
  document.getElementById("soundText").textContent = store.sound ? "音效" : "静音";
  soundButton.title = store.sound ? "音效已开，点击关闭" : "音效已关，点击打开";
}
soundButton.addEventListener("click", () => {
  store.sound = !store.sound;
  saveStore();
  syncSoundButton();
  if (store.sound) sfx.correct();
  toast(store.sound ? "音效已打开" : "音效已关闭");
});
syncSoundButton();

window.addEventListener("load", () => {
  sizeConfetti();
  drawMapLines();
});

if (!location.hash) history.replaceState(null, "", "#/");
render();
paintTopStars(false);
</script>
</body>
</html>
