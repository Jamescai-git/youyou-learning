<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F8F4">
<meta name="description" content="优优教育二年级上册数学乘法口诀大富翁游戏化学习网站">
<title>优优教育 · 乘法口诀大富翁</title>
<style>
:root{
  --ink:#22312A; --ink-2:#4D5D53; --muted:#76837A; --line:#DCE4DC;
  --bg:#F4F7F1; --card:#FFFFFF; --primary:#34A853; --primary-d:#237242; --primary-soft:#E7F5EA;
  --blue:#4A90D9; --orange:#F2994A; --pink:#EC7796; --purple:#8E7CC3; --yellow:#F2C14E; --gold:#E9B23C; --red:#D9534F;
  --r-sm:14px; --r:20px; --r-lg:26px; --r-xl:34px;
  --shadow:0 10px 28px rgba(32,52,45,.07); --shadow-lg:0 18px 44px rgba(32,52,45,.12);
  --ease:cubic-bezier(.22,1,.36,1); --top:74px; --bottom:68px;
  --accent:#34A853; --soft:#E7F5EA;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  padding:calc(var(--top) + 12px) 0 calc(var(--bottom) + 18px);
  overflow-x:hidden;
}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:scale(.97)}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:3px solid rgba(52,168,83,.35);outline-offset:3px;border-radius:12px}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:80;background:rgba(250,252,248,.92);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;height:100%;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0;transition:transform .2s var(--ease)}
.brand:hover{transform:translateY(-1px)}
.brand-logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;background:#FFF1D2;box-shadow:inset 0 0 0 1px #fff,0 5px 12px rgba(178,122,30,.15)}
.brand-text{min-width:0;line-height:1.15;text-align:left}
.brand-name{display:block;font-size:15px;font-weight:900}
.brand-sub{display:block;font-size:10px;font-weight:750;color:var(--muted);margin-top:2px;white-space:nowrap}
.top-spacer{flex:1}
.home-link{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:900;text-decoration:none;color:var(--ink)}
.star-chip,.sound-btn,.parent-btn{height:40px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 3px 10px rgba(37,75,57,.06)}
.star-chip{display:inline-flex;align-items:center;gap:5px;padding:0 12px;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.star-chip span{font-size:11px;color:var(--muted);font-weight:800}
.star-chip.bump{animation:pop .5s var(--ease)}
.sound-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 11px;font-size:12px;font-weight:900}
.sound-btn[aria-pressed="false"]{background:#F1F1EE;color:var(--muted)}
.parent-btn{display:inline-flex;align-items:center;gap:6px;padding:0 13px;background:var(--ink);color:#fff;font-size:12px;font-weight:900;box-shadow:0 6px 16px rgba(32,52,45,.18)}
.pb-short{display:none}
.authorbar{position:fixed;left:0;right:0;bottom:0;height:var(--bottom);z-index:80;background:rgba(255,254,250,.92);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.author-inner{max-width:1180px;height:100%;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:10px}
.author-photo{width:42px;height:42px;border-radius:13px;flex:none;background:#E7F3E7;box-shadow:0 0 0 2px #fff,0 4px 12px rgba(32,52,45,.15)}
.author-meta{min-width:0;line-height:1.25}
.author-meta b{display:block;font-size:13px;font-weight:900}
.author-meta span{display:block;font-size:10px;font-weight:750;color:var(--muted);margin-top:1px}
.author-line{flex:1}
.author-tag{display:inline-flex;align-items:center;gap:5px;background:var(--primary-soft);color:var(--primary-d);font-size:10px;font-weight:900;padding:6px 10px;border-radius:999px;white-space:nowrap}
.app{max-width:1180px;margin:0 auto;padding:0 18px}
.eyebrow{margin:0 0 5px;font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--primary)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 16px}
.page-head h1{font-size:clamp(24px,3.4vw,34px);font-weight:900}
.head-sub{margin:6px 0 0;color:var(--ink-2);font-size:14px;font-weight:700;line-height:1.5}
.primary-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;border-radius:999px;background:var(--primary);color:#fff;font-size:16px;font-weight:900;box-shadow:0 10px 22px rgba(52,168,83,.25);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.primary-btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px rgba(52,168,83,.3)}
.ghost-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:900;color:var(--ink);transition:transform .2s var(--ease)}
.ghost-btn:hover{transform:translateY(-1px)}
.speech-btn{display:inline-flex;align-items:center;gap:5px;height:42px;border-radius:999px;background:var(--primary-soft);color:var(--primary-d);padding:0 14px;font-size:13px;font-weight:900;flex:none}
/* ---------- 大富翁棋盘 ---------- */
.board-wrap{background:linear-gradient(160deg,#FFFDF5 0%,#F1F8EE 100%);border:1px solid var(--line);border-radius:var(--r-xl);padding:18px;box-shadow:var(--shadow)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{position:relative;min-height:156px;border-radius:24px;background:#fff;border:2px solid var(--line);padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;border-radius:22px 22px 0 0;background:var(--accent)}
.t-no{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.06em}
.t-main{display:flex;align-items:center;gap:9px}
.t-icon{width:46px;height:46px;border-radius:15px;background:var(--soft);display:grid;place-items:center;font-size:25px;flex:none}
.t-title{font-size:17px;font-weight:900;line-height:1.25}
.t-game{font-size:12px;font-weight:800;color:var(--ink-2)}
.houses{display:flex;gap:5px;margin-top:auto}
.house{width:36px;height:36px;border-radius:11px;background:#F2F4EF;display:grid;place-items:center;font-size:20px;filter:grayscale(1);opacity:.42}
.house.on{filter:none;opacity:1;background:#FFF4D6;box-shadow:inset 0 0 0 1px #F4DFA0}
.t-stars{font-size:12px;font-weight:900;color:#B5821C;font-variant-numeric:tabular-nums}
.tile-start,.tile-end{align-items:center;justify-content:center;text-align:center}
.tile-start{background:linear-gradient(150deg,#EAF6EC,#FFFFFF)}
.tile-end{background:linear-gradient(150deg,#FFF4D6,#FFFFFF)}
.tile-start .t-icon,.tile-end .t-icon{width:62px;height:62px;font-size:34px;border-radius:20px}
.tile.next{border-color:var(--primary);animation:glow 1.8s ease-in-out infinite}
.next-badge{position:absolute;left:12px;top:-13px;background:var(--primary);color:#fff;font-size:11px;font-weight:900;padding:4px 10px;border-radius:999px;box-shadow:0 6px 14px rgba(52,168,83,.3);white-space:nowrap}
.pawn{position:absolute;top:-18px;right:-8px;width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:27px;box-shadow:0 8px 18px rgba(32,52,45,.2);border:2px solid #FFE2A0;animation:hop 1.6s ease-in-out infinite;z-index:3}
.path-arrow{position:absolute;font-size:16px;color:#B9C7B9;font-weight:900;pointer-events:none}
.route-tip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 2px 0;font-size:13px;font-weight:800;color:var(--ink-2)}
.route-tip span{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 10px}
/* ---------- 思维导图 ---------- */
.mind{grid-column:1/-1;position:relative;padding:6px 0}
.mind-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.mind-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr minmax(220px,.9fr) 1fr;gap:14px 18px;align-items:stretch}
.center-card{grid-column:2;grid-row:1/span 3;border-radius:var(--r-xl);background:linear-gradient(160deg,#FFFFFF,#FFF6DE);border:2px solid #F4DFA0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 18px;box-shadow:var(--shadow-lg)}
.center-emoji{width:98px;height:98px;border-radius:32px;background:#FFE9B0;display:grid;place-items:center;font-size:50px;margin-bottom:14px}
.center-card h2{font-size:26px;font-weight:900;line-height:1.25}
.center-card p{margin:8px 0 14px;font-size:13px;font-weight:800;color:var(--ink-2);line-height:1.55}
.unit-card{position:relative;background:#fff;border-radius:var(--r-lg);padding:14px;border:1px solid var(--line);border-top:6px solid var(--accent);box-shadow:var(--shadow)}
.uc-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left}
.uc-icon{width:40px;height:40px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:21px;flex:none}
.uc-title{font-size:15px;font-weight:900;line-height:1.3}
.uc-sub{display:block;font-size:11px;font-weight:800;color:var(--muted)}
.uc-go{margin-left:auto;font-size:18px;color:var(--muted)}
.leaves{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.leaf{display:inline-flex;align-items:center;gap:4px;min-height:38px;padding:6px 12px;border-radius:999px 999px 999px 6px;background:var(--soft);color:var(--ink);font-size:13px;font-weight:850;line-height:1.3;text-align:left;transition:transform .2s var(--ease)}
.leaf:hover{transform:translateY(-2px)}
/* ---------- 单元页 ---------- */
.unit-hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.unit-hero .t-icon{width:64px;height:64px;font-size:34px;border-radius:21px}
.tabs{display:inline-flex;background:#fff;border-radius:999px;padding:5px;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:14px}
.tab{height:46px;padding:0 24px;border-radius:999px;font-size:15px;font-weight:900;color:var(--ink-2)}
.tab.on{background:var(--ink);color:#fff}
.capsules{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.capsules::-webkit-scrollbar{display:none}
.capsule{flex:none;height:40px;padding:0 15px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:850;font-size:13px}
.capsule.on{background:var(--accent);color:#fff;border-color:transparent}
.lesson-shell,.game-shell{background:#fff;border-radius:var(--r-xl);padding:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px}
.lesson-visual{border-radius:var(--r-lg);background:var(--soft);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:290px;text-align:center}
.vis-row{font-size:clamp(26px,4.2vw,42px);line-height:1.3;letter-spacing:.05em;word-break:break-all}
.vis-formula{font-size:clamp(24px,3.8vw,38px);font-weight:900;color:var(--primary-d);line-height:1.3}
.vis-cap{font-size:14px;font-weight:800;color:var(--ink-2);line-height:1.5}
.lesson-text h2{font-size:24px;font-weight:900;line-height:1.3}
.lesson-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.steps{list-style:none;padding:0;margin:12px 0;display:grid;gap:9px;counter-reset:s}
.steps li{position:relative;padding:11px 12px 11px 46px;border-radius:16px;background:#F7F9F5;font-size:16px;line-height:1.7;font-weight:650}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:11px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center}
.tip-box,.example-box{border-radius:18px;padding:13px 15px;font-size:16px;line-height:1.65;font-weight:750;margin-top:10px}
.tip-box{background:#FFF6DA;border:1px solid #F4DFA0}
.example-box{background:#EAF3FC;border:1px solid #CFE2F6}
.tip-box b,.example-box b{display:block;font-size:13px;margin-bottom:3px}
.lesson-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.lesson-count{font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
/* ---------- 玩一玩：关卡选择 ---------- */
.game-intro{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.gi-emoji{width:110px;height:110px;border-radius:34px;background:var(--soft);display:grid;place-items:center;font-size:56px}
.gi-type{display:inline-block;font-size:12px;font-weight:900;color:var(--accent);background:var(--soft);padding:4px 10px;border-radius:999px;margin-bottom:6px}
.game-intro h2{font-size:24px;font-weight:900}
.game-intro p{margin:6px 0 0;font-size:15px;font-weight:700;color:var(--ink-2);line-height:1.6}
.rules{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.rules span{font-size:12px;font-weight:850;background:#F5F8F3;border:1px solid var(--line);padding:5px 10px;border-radius:999px}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}
.level-card{position:relative;text-align:left;border-radius:24px;background:#fff;border:2px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:6px;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.level-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.lv-house{font-size:36px;line-height:1}
.lv-name{font-size:19px;font-weight:900}
.lv-desc{font-size:13px;color:var(--ink-2);font-weight:700;line-height:1.5}
.lv-stars{font-size:18px;letter-spacing:2px}
.lv-go{margin-top:6px;font-size:14px;font-weight:900;color:var(--accent)}
.level-card.rec{border-color:var(--primary);animation:glow 1.8s ease-in-out infinite}
.rec-badge{position:absolute;top:-13px;right:12px;background:var(--primary);color:#fff;font-size:12px;font-weight:900;padding:5px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 14px rgba(52,168,83,.3)}
/* ---------- 答题通用 ---------- */
.game-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lv-pill{font-size:12px;font-weight:900;background:var(--soft);color:var(--ink);padding:6px 11px;border-radius:999px}
.progress{flex:1;min-width:120px;height:12px;border-radius:999px;background:#EEF2EC;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#7BCB8F);border-radius:999px;transition:width .4s var(--ease)}
.q-count{font-weight:900;font-variant-numeric:tabular-nums}
.question{margin:14px 0;padding:15px 16px;border-radius:22px;background:var(--soft);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.question p{margin:0;flex:1;min-width:200px;font-size:21px;font-weight:900;line-height:1.5}
.stage{min-height:230px;border-radius:24px;background:#FBFCFA;border:1px dashed var(--line);padding:16px;position:relative}
.game-feedback{min-height:28px;margin-top:10px;text-align:center;font-size:17px;font-weight:900}
.game-feedback.ok{color:var(--primary-d)}
.game-feedback.bad{color:var(--red)}
.action-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.choice-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.choice{min-height:60px;border-radius:20px;background:#fff;border:2px solid var(--line);font-size:20px;font-weight:900;padding:8px;line-height:1.3}
.choice.ok{border-color:var(--primary);background:#E7F5EA}
.choice.bad{border-color:#E7908C;background:#FDECEA}
/* 分配型 */
.monkeys{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.monkey{border-radius:20px;background:#fff;border:2px solid var(--line);padding:10px 6px;text-align:center;min-height:124px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .2s,background .2s}
.monkey .m-face{font-size:34px;line-height:1}
.plate{min-height:44px;width:100%;font-size:21px;line-height:1.2;word-break:break-all;background:#FAF6EE;border-radius:14px;padding:4px}
.m-count{font-size:12px;font-weight:900;color:var(--muted)}
.monkey.full{border-color:var(--primary);background:#F1FAF3}
.monkey.flash{animation:pop .35s var(--ease)}
.pile{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.pile-tip{width:100%;text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
.assign-btn{display:inline-flex;align-items:center;gap:6px;height:56px;padding:0 20px;border-radius:999px;background:#FFF1DB;border:2px solid #F3D9A8;font-size:17px;font-weight:900;color:#8A5A12}
/* 摆放型 */
.cards-tray{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:14px}
.f-card{min-width:96px;height:58px;padding:0 14px;border-radius:16px;background:#fff;border:2px solid var(--line);font-size:19px;font-weight:900;transition:transform .2s var(--ease)}
.f-card.sel{border-color:var(--blue);background:#EAF3FC;transform:translateY(-4px);box-shadow:0 8px 16px rgba(74,144,217,.2)}
.f-card.used{visibility:hidden}
.place-zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.zone{min-height:96px;border-radius:20px;border:2px dashed #C9D6C9;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;padding:8px;text-align:center}
.zone .z-label{font-size:13px;color:var(--muted)}
.zone .z-slot{font-size:20px;min-height:26px}
.zone.filled{border-style:solid;border-color:var(--primary);background:#F1FAF3}
.zone.bad{border-style:solid;border-color:#E7908C;background:#FDECEA}
/* 捕捉型（打地鼠） */
.catch-field{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hole{position:relative;height:132px;border-radius:24px;background:linear-gradient(#EEF6E8,#D6E8CB);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.hole::after{content:"";position:absolute;bottom:10px;left:14%;right:14%;height:22px;border-radius:50%;background:#7A5B3E;opacity:.5;z-index:0}
.mole{position:relative;z-index:1;width:92px;margin-bottom:18px;border-radius:40px 40px 18px 18px;background:#fff;border:2px solid #E0C9A6;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateY(120%);transition:transform .35s var(--ease)}
.mole.up{transform:translateY(0)}
.mole .m-emoji{font-size:30px;line-height:1}
.mole .m-sign{font-size:20px;font-weight:900;background:#FFF4D6;border-radius:10px;padding:2px 8px;font-variant-numeric:tabular-nums}
.mole.ok{border-color:var(--primary);background:#F1FAF3}
.mole.bad{border-color:#E7908C;background:#FDECEA}
.timer-bar{height:8px;border-radius:999px;background:#EEF2EC;overflow:hidden;margin-bottom:12px}
.timer-bar i{display:block;height:100%;background:var(--orange);border-radius:999px}
/* 归类型 */
.sort-item{display:flex;justify-content:center;margin-bottom:14px}
.sort-card{font-size:26px;font-weight:900;padding:14px 26px;border-radius:22px;background:#fff;border:2px solid var(--blue);box-shadow:0 10px 20px rgba(74,144,217,.18);animation:pop .4s var(--ease)}
.sort-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.bin{min-height:124px;border-radius:22px 22px 32px 32px;background:#FFF8EC;border:2px solid #F0D7AA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;padding:8px}
.bin .b-icon{font-size:34px;line-height:1}
.bin .b-label{font-size:22px;font-variant-numeric:tabular-nums}
.bin .b-in{font-size:12px;color:var(--muted);min-height:16px}
.bin.ok{border-color:var(--primary);background:#F1FAF3}
.bin.bad{border-color:#E7908C;background:#FDECEA}
/* 建构型 */
.build-area{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:stretch}
.tower{display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:5px;min-height:210px;padding:10px;border-radius:18px;background:#fff;border:1px solid var(--line);overflow:hidden}
.brick-row{display:flex;gap:3px;flex-wrap:wrap;align-items:center;animation:pop .3s var(--ease)}
.brick-row em{font-style:normal;font-size:11px;font-weight:900;color:var(--muted);margin-right:4px;min-width:30px}
.brick{width:20px;height:20px;border-radius:6px;background:var(--orange);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.build-meter{text-align:center;min-width:160px;display:flex;flex-direction:column;justify-content:center;gap:4px;background:#FFF8EC;border-radius:18px;padding:12px}
.build-meter b{display:block;font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.build-meter .target{font-size:14px;color:var(--ink-2);font-weight:800}
.build-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
/* 操作模拟型 */
.simulate-panel{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;align-content:start}
.box{min-height:80px;border-radius:16px;background:#fff;border:2px dashed #E3C9A4;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;font-size:15px;line-height:1.1;padding:5px;text-align:center}
.box.full{border-style:solid;border-color:var(--gold);background:#FFF8E5}
.box-label{width:100%;font-size:11px;font-weight:900;color:var(--muted)}
.keypad-wrap{display:flex;flex-direction:column;gap:8px}
.answer-screen{height:64px;border-radius:18px;background:var(--ink);color:#fff;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.answer-screen.empty{color:rgba(255,255,255,.45);font-size:18px}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key{height:54px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:22px;font-weight:900;box-shadow:0 3px 0 #E1E7DF}
.key.ok-key{background:var(--primary);color:#fff;border-color:transparent;box-shadow:0 3px 0 var(--primary-d)}
.key.del-key{background:#F3F1EC;font-size:16px}
/* 结算 */
.result{text-align:center;padding:24px 10px}
.result-build{font-size:64px;line-height:1;animation:pop .6s var(--ease)}
.result-stars{font-size:54px;letter-spacing:6px;margin:10px 0}
.result h2{font-size:28px;font-weight:900}
.result p{font-size:16px;color:var(--ink-2);font-weight:750;line-height:1.6;margin:8px 0}
.result .action-row{margin-top:18px}
/* 弹窗与家长中心 */
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(25,38,31,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.modal{width:min(780px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:28px;padding:20px;box-shadow:var(--shadow-lg);animation:pop .3s var(--ease)}
.modal.small{width:min(420px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.modal-head h2{font-size:22px;font-weight:900}
.modal-close{width:42px;height:42px;border-radius:50%;background:#F2F4EF;font-size:17px;font-weight:900;flex:none}
.gate-tip{margin:0;font-size:14px;font-weight:750;color:var(--ink-2);text-align:center;line-height:1.6}
.gate-q{font-size:40px;font-weight:900;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.gate-input{width:100%;height:58px;border-radius:18px;border:2px solid var(--line);font-size:26px;text-align:center;font-weight:900;outline:none}
.gate-input:focus{border-color:var(--primary)}
.gate-msg{min-height:22px;text-align:center;color:var(--red);font-weight:800;margin:8px 0}
.gate-actions{display:flex;justify-content:center;gap:10px}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{border-radius:18px;background:#F5F8F3;padding:13px 8px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:800}
.table-wrap{overflow-x:auto;margin-top:14px;-webkit-overflow-scrolling:touch}
.parent-table{width:100%;border-collapse:collapse;font-size:13px;min-width:660px}
.parent-table th,.parent-table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.parent-table th{font-size:12px;color:var(--muted);white-space:nowrap}
.lv-mini{display:block;font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap}
.status{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:900;white-space:nowrap}
.s1{background:#F1F1EE;color:#7A7A72}
.s2{background:#FFF1DB;color:#B26A12}
.s3{background:#EAF3FC;color:#2E6DAE}
.s4{background:#E7F5EA;color:var(--primary-d)}
.parent-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:15px}
.parent-note{font-size:12px;color:var(--muted);font-weight:750}
.danger-btn{height:46px;padding:0 18px;border-radius:999px;background:#FDECEA;color:#C0392B;font-weight:900;font-size:14px}
.danger-btn.armed{background:var(--red);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(var(--bottom) + 18px);z-index:120;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;font-size:14px;font-weight:850;padding:11px 18px;border-radius:999px;box-shadow:var(--shadow-lg);transition:opacity .25s,transform .25s var(--ease);max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;z-index:110;pointer-events:none}
.shake{animation:shake .4s}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px rgba(52,168,83,.14),var(--shadow)}50%{box-shadow:0 0 0 8px rgba(52,168,83,.24),var(--shadow-lg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.85);opacity:.4}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:1024px){
  .mind-grid{grid-template-columns:1fr 1fr}
  .center-card{grid-column:1/-1;grid-row:auto}

  .game-intro{grid-template-columns:1fr;text-align:center}
  .gi-emoji{margin:0 auto;width:88px;height:88px;font-size:44px}

@media (max-width:430px){
  .sound-text{display:none}
  .app{padding:0 10px}

const CN_DIGITS=['零','一','二','三','四','五','六','七','八','九'];
function num2cn(n){
  n=Math.floor(Number(n)||0);
  if(n<0)return '负'+num2cn(-n);
  if(n<10)return CN_DIGITS[n];
  if(n<20)return n===10?'十':'十'+CN_DIGITS[n%10];
  if(n<100){const tens=Math.floor(n/10),ones=n%10;return CN_DIGITS[tens]+'十'+(ones?CN_DIGITS[ones]:'')}
  if(n<1000){const h=Math.floor(n/100),rest=n%100;return CN_DIGITS[h]+'百'+(rest?(rest<10?'零'+CN_DIGITS[rest]:num2cn(rest)):'')}
  return String(n);
}
function kj(a,b){
  const x=Math.min(a,b),y=Math.max(a,b),p=a*b;
  if(p<10)return CN_DIGITS[x]+CN_DIGITS[y]+'得'+CN_DIGITS[p];
  if(p===10)return CN_DIGITS[x]+CN_DIGITS[y]+'一十';
  return CN_DIGITS[x]+CN_DIGITS[y]+num2cn(p);
}
function stripEmoji(text){
  let out='';
  for(const ch of String(text)){
    const code=ch.codePointAt(0);
    if(code>=0xFE00&&code<=0xFE0F)continue;
    if(code>=0x1F000&&code<=0x1FAFF)continue;
    if(code>=0x2600&&code<=0x27BF)continue;
    if(code===0x200D)continue;
    out+=ch;
  }
  return out;
}
function normalizeSpeech(text){
  let s=stripEmoji(text);
  s=s.split('\n').join('，');
  s=s.split('——').join('，').split('—').join('，');
  s=s.split('“').join('').split('”').join('').split('【').join('').split('】').join('');
  s=s.split('（ ）').join('几').split('( )').join('几').split('（  ）').join('几');
  s=s.split('？').join('，').split('?').join('，').split('！').join('，').split('!').join('，');
  s=s.split('×').join('乘').split('=').join('等于').split('+').join('加').split('－').join('减').split('-').join('减').split('÷').join('除以');
  s=s.replace(/([0-9]+)/g,m=>num2cn(Number(m)));
  s=s.split('2个').join('两个').split('2只').join('两只').split('2盘').join('两盘').split('2双').join('两双').split('2盒').join('两盒').split('2张').join('两张').split('2块').join('两块').split('2颗').join('两颗').split('2排').join('两排').split('2组').join('两组').split('2人').join('两人').split('2天').join('两天').split('2句').join('两句').split('2道').join('两道').split('2棵').join('两棵').split('2辆').join('两辆').split('2只').join('两只');
  s=s.split('数一数').join('鼠一鼠').split('数一').join('鼠一').split('再数').join('再鼠').split('数出').join('数出').split('数完').join('鼠完').split('数到').join('鼠到').split('去数').join('去鼠').split('数数').join('鼠树');
  s=s.split('乘数').join('乘树').split('份数').join('份树').split('得数').join('得树').split('数学').join('树学').split('数字').join('树字').split('数').join('树');
  s=s.split('一行').join('一排').split('两行').join('两排').split('三行').join('三排');
  s=s.split(',').join('，').split(':').join('：');
  s=s.replace(/[ \t]+/g,' ');
  return s;
}
function chunkText(text){
  const raw=String(text);
  const pieces=[];
  let buffer='';
  for(const ch of raw){
    buffer+=ch;
    if(ch==='。'||ch==='；'){if(buffer.trim())pieces.push(buffer.trim());buffer=''}
  }
  if(buffer.trim())pieces.push(buffer.trim());
  const chunks=[];
  buffer='';
  pieces.forEach(piece=>{
    if((buffer+piece).length>55&&buffer){chunks.push(buffer);buffer=piece}
    else buffer+=piece;
  });
  if(buffer)chunks.push(buffer);
  return chunks.length?chunks:[''];
}
let chineseVoice=null,speechRunToken=0,speechWarningShown=false,lastSpoken='';
function refreshChineseVoice(){
  if(!('speechSynthesis' in window))return;
  try{
    const voices=window.speechSynthesis.getVoices()||[];
    const chinese=voices.filter(voice=>/^zh([-_]|$)/i.test(voice.lang||'')||/chinese|中文|汉语|普通话/i.test(voice.name||''));
    chineseVoice=chinese.find(voice=>/xiaoxiao|huihui|yaoyao|female|女/i.test(voice.name||''))||chinese.find(voice=>voice.localService)||chinese[0]||null;
  }catch(error){chineseVoice=null}
}
if('speechSynthesis' in window){
  refreshChineseVoice();
  try{window.speechSynthesis.addEventListener('voiceschanged',refreshChineseVoice)}catch(error){}
  window.speechSynthesis.onvoiceschanged=refreshChineseVoice;
}
function stopSpeech(){
  speechRunToken++;
  try{if('speechSynthesis' in window)window.speechSynthesis.cancel()}catch(error){}
}
function speakText(text,options){
  const opts=options||{};
  if(!store.sound||!text)return false;
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
    if(!speechWarningShown){speechWarningShown=true;toast('这个浏览器不能朗读，请换用 Edge 或 Chrome')}
    return false;
  }
  refreshChineseVoice();
  try{window.speechSynthesis.cancel()}catch(error){}
  speechRunToken++;
  const token=speechRunToken;
  const chunks=chunkText(normalizeSpeech(text));
  lastSpoken=chunks.join('');
  let index=0;
  const next=()=>{
    if(token!==speechRunToken||index>=chunks.length)return;
    const utterance=new SpeechSynthesisUtterance(chunks[index]);
    index++;
    utterance.lang='zh-CN';
    utterance.rate=opts.rate||0.62;
    utterance.pitch=opts.pitch||1.04;
    utterance.volume=1;
    if(chineseVoice)utterance.voice=chineseVoice;
    utterance.onend=next;
    utterance.onerror=next;
    try{window.speechSynthesis.speak(utterance)}catch(error){}
  };
  next();
  return true;
}
const AudioCtor=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function tone(freq,duration,type,delay){
  if(!store.sound)return;
  try{
    audioCtx=audioCtx||new AudioCtor();
    const start=audioCtx.currentTime+(delay||0);
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type=type;
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(0.12,start);
    gain.gain.exponentialRampToValueAtTime(0.001,start+duration);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(start);osc.stop(start+duration);
  }catch(error){}
}

    rot:Math.random()*Math.PI,vr:-0.08+Math.random()*0.16,
    color:['#F2C14E','#34A853','#4A90D9','#EC7796','#8E7CC3','#E98A4C'][Math.floor(Math.random()*6)]
  }));
  if(!confettiRunning){confettiRunning=true;requestAnimationFrame(confettiFrame)}
}
function confettiFrame(){
  confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  confettiPieces.forEach(piece=>{
    piece.x+=piece.vx;piece.y+=piece.vy;piece.rot+=piece.vr;
    confettiCtx.save();
    confettiCtx.translate(piece.x,piece.y);
    confettiCtx.rotate(piece.rot);
    confettiCtx.fillStyle=piece.color;
    confettiCtx.fillRect(-piece.r,-piece.r/2,piece.r*2,piece.r);
    confettiCtx.restore();
  });
  confettiPieces=confettiPieces.filter(piece=>piece.y<confettiCanvas.height+40);
  if(confettiPieces.length)requestAnimationFrame(confettiFrame);
  else{confettiRunning=false;confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height)}
}

function parseRoute(){
  const raw=(location.hash||'').replace(/^#/,'');
  const parts=raw.split('/').filter(Boolean);
  if(parts[0]==='unit'&&parts[1]){
    const unit=UNITS.find(item=>item.id===parts[1]);
    if(unit){
      if(parts[2]==='game')return {view:'game',unit};
      const idx=Math.max(0,Math.min(Number(parts[3])||0,unit.points.length-1));
      return {view:'study',unit,idx};
    }
  }
  if(parts[0]==='play'&&parts[1]){
    const unit=UNITS.find(item=>item.id===parts[1]);
    if(unit){const li=Math.max(0,Math.min(Number(parts[2])||0,LEVELS.length-1));return {view:'play',unit,li}}
  }
  return {view:'map'};
}
function render(force){
  const key=(location.hash||'#map').replace(/^#/,'')||'map';
  if(!force&&key===lastRenderedKey)return;
  lastRenderedKey=key;
  updateTop();
  const route=parseRoute();
  if(route.view==='play')renderPlay(route.unit,route.li);
  else if(route.view==='study')renderStudy(route.unit,route.idx);
  else if(route.view==='game')renderGame(route.unit);
  else renderMap();
  window.scrollTo({top:0,behavior:'auto'});
}

function makeOptions(answer,cands,count){
  const list=[String(answer)];
  for(const cand of cands){
    const text=String(cand);
    if(list.indexOf(text)>=0)continue;
    list.push(text);
    if(list.length>=count)break;
  }
  let extra=1;
  while(list.length<count&&extra<60){
    const text=String(Number(answer)+extra);
    if(list.indexOf(text)<0)list.push(text);
    extra++;
  }
  return shuffle(list);
}

function giveOne(index){
  const q=G.questions[G.qi];
  if(G.locked||q.answered)return;
  if(q.got[index]>=q.k){toast('这只小猴已经分够 '+q.k+' 个啦，分给别的小猴吧');sfx.wrong();return}
  q.got[index]++;
  sfx.pop();
  paintAssign();
  if(q.got.reduce((a,b)=>a+b,0)>=q.total){q.distributed=true;paintAssign();speakText(q.speech)}
}
function giveRound(){
  const q=G.questions[G.qi];
  if(G.locked||q.answered)return;
  let changed=false;
  q.got=q.got.map(count=>{
    if(count<q.k){changed=true;return count+1}
    return count;
  });
  if(!changed){toast('每只小猴都已经分够啦');return}
  sfx.pop();
  paintAssign();
  if(q.got.reduce((a,b)=>a+b,0)>=q.total){q.distributed=true;paintAssign();speakText(q.speech)}
}
function allFacts(bList,aMin,aMax){
  const facts=[];
  bList.forEach(b=>{for(let a=aMin;a<=aMax;a++)facts.push({a,b,p:a*b})});
  return facts;
}
function placeQuestion(unit,li){
  const list=[];

      const a=rand(1,5),b=5,p=a*b;
      const zones=makeOptions(p,[p+5,p-5,p+1,p-1,p+10],4).map(value=>({label:'积',value:value,ok:Number(value)===p}));
      list.push({text:'把卡片放进积正确的格子里：'+a+'×'+b,speech:'把'+a+'乘'+b+'这张卡片，放进积正确的格子里',answer:String(p),zones,card:a+'×'+b,picked:false});
    }else if(li===1){
      const b=pick([2,5]),a=rand(1,5),p=a*b;
      const pool=allFacts([2,5],1,5).filter(f=>f.p!==p);
      const picked=shuffle(pool).slice(0,3);
      const zones=shuffle([{a,b,p}].concat(picked)).map(f=>({label:'算式',value:f.a+'×'+f.b+'='+f.p,ok:f.a===a&&f.b===b}));
      list.push({text:'把口诀卡片放进对应的算式格子里：'+kj(a,b),speech:'把口诀'+kj(a,b)+'，放进对应的算式格子里',answer:kj(a,b),zones,card:kj(a,b),picked:false});
    }else{
      const b=pick([2,5]),a=rand(3,5),p=a*b;
      const pool=allFacts([2,5],3,5).filter(f=>f.p!==p);
      const picked=shuffle(pool).slice(0,3);
      const zones=shuffle([{a,b,p}].concat(picked)).map(f=>({label:'算式',value:f.a+'×'+f.b,ok:f.p===p}));
      list.push({text:'积是 '+p+'，该放进哪个算式格子？',speech:'积是'+num2cn(p)+'，该放进哪个算式格子？',answer:String(p),zones,card:String(p),picked:false});
    }
  }

}

function catchQuestion(unit,li){
  const list=[];

    const t=pick([3,4]);
    let a,p,text,speech,answer;

      a=rand(1,5);p=t*a;

      text=CN_DIGITS[t]+CN_DIGITS[a]+'（  ）';
      speech=num2cn(t)+num2cn(a)+'得几';
      answer=p;
    }else{
      a=rand(2,4);

      speech=num2cn(t)+'乘'+num2cn(a)+(op==='+'?'加':'减')+num2cn(extra)+'等于几';
      answer=p;

function fillMoles(q){

}

    }else if(li===1){
      card=kj(t,a);
      text='把口诀卡片送进积正确的篮子。';
      speech='把口诀'+kj(t,a)+'，送进积正确的篮子';
      zones=makeOptions(p,[p+t,p-t,p+1,p-1,p+6,p-6],4).map(value=>({value:value,ok:Number(value)===p}));
    }else{
      card=String(p);
      text='积是 '+p+'，送进哪个算式篮子？';
      speech='积是'+num2cn(p)+'，送进哪个算式篮子？';
      const pool=allFacts([6,7],1,9).filter(f=>f.p!==p);
      const picked=shuffle(pool).slice(0,3);
      zones=shuffle([{a,b:t,p}].concat(picked)).map(f=>({value:f.a+'×'+f.b,ok:f.p===p}));
      if(!zones.some(zone=>zone.ok))zones[0]={value:t+'×'+a,ok:true};
    }
    list.push({text,speech,answer:String(p),card,zones,answered:false});
  }
  return list;
}
function paintSort(){
  const q=G.questions[G.qi];
  const stage=document.getElementById('stage');
  if(!stage||q.answered)return;
  const bins=q.zones.map((zone,index)=>'<button class="bin" data-bin="'+index+'" type="button"><span class="b-icon" aria-hidden="true">🧺</span><span class="b-label">'+zone.value+'</span><span class="b-in">放这里</span></button>').join('');
  stage.innerHTML='<p class="stage-note">看准卡片上的数，再点一个篮子。</p>'+
    '<div class="sort-item"><div class="sort-card">'+q.card+'</div></div>'+
    '<div class="sort-bins">'+bins+'</div>';
  stage.querySelectorAll('[data-bin]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(G.locked||q.answered)return;
      const zone=q.zones[Number(btn.dataset.bin)];
      if(zone.ok){btn.classList.add('ok');submit(true,q.answer)}
      else{btn.classList.add('bad');submit(false,q.answer)}
    });
  });
}
function buildQuestion(unit,li){
  const list=[];
  for(let i=0;i<9;i++){
    if(li===0){
      const size=8;
      const groups=rand(2,4);
      const target=size*groups;
      list.push({text:'一组 '+size+' 块，搭 '+groups+' 组。',speech:'一组'+size+'块积木，搭'+groups+'组',size,groups,target,mode:'groups',sizes:[size],rows:[],answered:false});
    }else if(li===1){
      const size=pick([8,9]);
      const groups=rand(4,8);
      const target=size*groups;
      list.push({text:'凑出 '+target+' 块，一组 '+size+' 块，要加几组？',speech:'凑出'+num2cn(target)+'块，一组'+num2cn(size)+'块，要加几组？',size,groups,target,mode:'total',sizes:[size],rows:[],answered:false});
    }else{
      const size=9;
      const groups=rand(5,8);
      const target=size*groups;
      list.push({text:'凑出 '+target+' 块，一组 8 块或 9 块，选哪种？',speech:'凑出'+num2cn(target)+'块，可以一组8块，也可以一组9块，选哪一种？',size,groups,target,mode:'choose',sizes:[8,9],rows:[],answered:false});
    }
  }
  return list;
}
function paintBuild(){
  const q=G.questions[G.qi];
  const stage=document.getElementById('stage');
  if(!stage||q.answered)return;
  const rows=q.rows.map((size,index)=>{
    let bricks='';
    for(let i=0;i<size;i++)bricks+='<span class="brick"></span>';
    return '<div class="brick-row"><em>第'+(index+1)+'组</em>'+bricks+'</div>';
  }).join('');
  const total=q.rows.reduce((a,b)=>a+b,0);
  const addButtons=q.sizes.map(size=>'<button class="ghost-btn" data-add="'+size+'" type="button">+ 一组 '+size+' 块</button>').join('');
  stage.innerHTML='<p class="stage-note">'+(q.mode==='choose'?'选一种大小一样的积木，一块一块搭高。':'每次加一组，积木要一样多。')+'</p>'+
    '<div class="build-area">'+
      '<div class="tower">'+(rows||'<span class="stage-note">还没放积木</span>')+'</div>'+
      '<div class="build-meter"><b>'+total+'</b><span>块 · 共 '+q.rows.length+' 组</span><span class="target">'+(q.mode==='groups'?'要搭 '+q.groups+' 组':'目标 '+q.target+' 块')+'</span></div>'+
    '</div>'+
    '<div class="build-ctrl">'+addButtons+
      '<button class="ghost-btn" data-sub="1" type="button">− 去掉一组</button>'+
      '<button class="primary-btn" data-ok="1" type="button">搭好了 ✓</button></div>';
  stage.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click',()=>buildAdd(Number(btn.dataset.add)));
  });
  stage.querySelector('[data-sub]').addEventListener('click',()=>{
    const target=G.questions[G.qi];
    if(G.locked||target.answered)return;
    if(!target.rows.length){toast('还没有积木可以去掉');return}
    target.rows.pop();
    sfx.pop();
    paintBuild();
  });
  stage.querySelector('[data-ok]').addEventListener('click',()=>buildConfirm());
}
function buildAdd(size){
  const q=G.questions[G.qi];
  if(G.locked||q.answered)return;
  if(q.rows.length>=9){toast('积木已经很高啦，先去掉一组吧');return}
  if(q.rows.length&&q.rows[0]!==size){toast('已经用一种积木搭起来了，先全部去掉才能换');return}
  q.rows.push(size);
  sfx.pop();
  paintBuild();
}
function buildConfirm(){
  const q=G.questions[G.qi];
  if(G.locked||q.answered)return;
  if(!q.rows.length){toast('先加一组积木吧');sfx.wrong();return}
  const total=q.rows.reduce((a,b)=>a+b,0);
  const ok=q.mode==='groups'?q.rows.length===q.groups:total===q.target;
  const result=q.groups+'×'+q.size+'='+q.target;
  if(ok)submit(true,result);
  else submit(false,'要搭 '+q.groups+' 组，'+result);
}
function simQuestion(unit,li){
  const list=[];
  for(let i=0;i<9;i++){
    let n,k,extra=0;
    if(li===0){n=rand(2,4);k=rand(2,5)}
    else if(li===1){n=rand(2,5);k=rand(6,9)}
    else{n=rand(2,4);k=rand(6,9);extra=rand(1,4)}
    const answer=n*k+extra;
    const text=extra?('每盒装 '+k+' 颗，装 '+n+' 盒，另外还有 '+extra+' 颗。一共有几颗？'):('每盒装 '+k+' 颗糖，装 '+n+' 盒。一共有几颗？');
    const speech=extra?('每盒装'+num2cn(k)+'颗，装'+num2cn(n)+'盒，另外还有'+num2cn(extra)+'颗。一共有几颗？'):('每盒装'+num2cn(k)+'颗糖，装'+num2cn(n)+'盒。一共有几颗？');
    list.push({text,speech,answer,n,k,extra,boxes:Array(n).fill(false),input:'',answered:false});
  }
  return list;
}
function paintSim(){
  const q=G.questions[G.qi];
  const stage=document.getElementById('stage');
  if(!stage||q.answered)return;
  let boxes='';
  for(let i=0;i<q.n;i++){
    if(q.boxes[i]){
      let candy='';
      for(let c=0;c<q.k;c++)candy+='🍬';
      boxes+='<button class="box full" data-box="'+i+'" type="button"><span class="box-label">第'+(i+1)+'盒</span>'+candy+'</button>';
    }else{
      boxes+='<button class="box" data-box="'+i+'" type="button"><span class="box-label">第'+(i+1)+'盒</span><span style="font-size:24px">＋</span></button>';
    }
  }
  if(q.extra){
    let candy='';
    for(let c=0;c<q.extra;c++)candy+='🍬';
    boxes+='<div class="extra-candy">另外还有<br>'+candy+'<br>'+q.extra+' 颗</div>';
  }
  const screen=q.input?q.input:'输入答案';
  stage.innerHTML='<p class="stage-note">先一盒一盒点满糖果，再用下面的键盘输入总数。</p>'+
    '<div class="simulate-panel"><div class="boxes">'+boxes+'</div>'+
    '<div class="keypad-wrap"><div class="answer-screen'+(q.input?'':' empty')+'" id="ansScreen">'+screen+'</div>'+
    '<div class="keypad">'+
      '<button class="key" data-key="1" type="button">1</button><button class="key" data-key="2" type="button">2</button><button class="key" data-key="3" type="button">3</button>'+
      '<button class="key" data-key="4" type="button">4</button><button class="key" data-key="5" type="button">5</button><button class="key" data-key="6" type="button">6</button>'+
      '<button class="key" data-key="7" type="button">7</button><button class="key" data-key="8" type="button">8</button><button class="key" data-key="9" type="button">9</button>'+
      '<button class="key del-key" data-key="del" type="button">删除</button><button class="key" data-key="0" type="button">0</button><button class="key ok-key" data-key="ok" type="button">确定</button>'+
    '</div></div></div>';
  stage.querySelectorAll('[data-box]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(G.locked||q.answered)return;
      const index=Number(btn.dataset.box);
      if(q.boxes[index]){toast('这一盒已经装满啦');sfx.wrong();return}
      q.boxes[index]=true;
      sfx.pop();
      paintSim();
      if(q.boxes.every(Boolean))toast('盒子装满啦，快算一算一共几颗');
    });
  });
  stage.querySelectorAll('[data-key]').forEach(btn=>{
    btn.addEventListener('click',()=>simKey(btn.dataset.key));
  });
}
function simKey(key){
  const q=G.questions[G.qi];
  if(!G||G.locked||q.answered)return;
  if(key==='ok'){simConfirm();return}
  if(key==='del'){q.input=q.input.slice(0,-1)}
  else{if(q.input.length>=3)return;if(q.input==='0')q.input='';q.input+=key}
  sfx.pop();
  paintSim();
}
function simConfirm(){
  const q=G.questions[G.qi];
  if(G.locked||q.answered)return;
  if(!q.boxes.every(Boolean)){toast('先把每个盒子都装满哦');sfx.wrong();return}
  if(!q.input){toast('先用键盘输入答案');sfx.wrong();return}
  const value=Number(q.input);
  if(value===q.answer)submit(true,'一共有 '+q.answer+' 颗');
  else submit(false,String(q.answer));
}
document.addEventListener('keydown',event=>{
  if(!G||G.finished||G.locked)return;
  if(G.unit.game.type!=='sim')return;
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  const route=parseRoute();
  if(route.view!=='play')return;
  if(event.key>='0'&&event.key<='9'){simKey(event.key)}
  else if(event.key==='Backspace'){event.preventDefault();simKey('del')}
  else if(event.key==='Enter'){simKey('ok')}
});
GENERATORS.catch=catchQuestion;
GENERATORS.sort=sortQuestion;
GENERATORS.build=buildQuestion;
GENERATORS.sim=simQuestion;
STAGES.catch=paintCatch;
STAGES.sort=paintSort;
STAGES.build=paintBuild;
STAGES.sim=paintSim;
const originalStartLevel=startLevel;
startLevel=function(unit,li){
  originalStartLevel(unit,li);
  if(unit.game.type==='catch')startCatchRotation();
};
render();

</script>
