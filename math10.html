<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F8F4">
<meta name="description" content="优优教育一年级上册数学10以内数加与减游戏化学习网站">
<title>优优教育 · 10以内加与减</title>
<style>
:root{
  --ink:#22312A; --ink-2:#4D5D53; --muted:#76837A; --line:#DCE4DC;
  --bg:#F4F7F1; --card:#FFFFFF; --primary:#34A853; --primary-d:#237242; --primary-soft:#E7F5EA;
  --blue:#4A90D9; --orange:#F2994A; --pink:#EC7796; --purple:#8E7CC3; --yellow:#F2C14E;
  --r-sm:14px; --r:20px; --r-lg:26px; --r-xl:34px;
  --shadow:0 10px 28px rgba(32,52,45,.07); --shadow-lg:0 18px 44px rgba(32,52,45,.12);
  --ease:cubic-bezier(.22,1,.36,1); --top:74px; --bottom:68px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  padding:calc(var(--top) + 12px) 0 calc(var(--bottom) + 18px);
  overflow-x:hidden;
}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid rgba(52,168,83,.35);outline-offset:3px;border-radius:12px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--top);z-index:80;
  background:rgba(250,252,248,.92);backdrop-filter:blur(20px) saturate(1.6);
  border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:1180px;height:100%;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0;transition:transform .2s var(--ease)}
.brand:hover{transform:translateY(-1px)}
.brand-logo{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;
  background:#E7F3E7;box-shadow:inset 0 0 0 1px #fff,0 5px 12px rgba(40,122,88,.13)
}
.brand-text{min-width:0;line-height:1.15;text-align:left}
.brand-name{display:block;font-size:15px;font-weight:900}
.brand-sub{display:block;font-size:10px;font-weight:750;color:var(--muted);margin-top:2px;white-space:nowrap}
.top-spacer{flex:1}
.star-chip,.icon-btn,.sound-btn,.parent-btn{
  height:40px;border-radius:999px;background:#fff;border:1px solid var(--line);
  box-shadow:0 3px 10px rgba(37,75,57,.06)
}
.star-chip{display:inline-flex;align-items:center;gap:5px;padding:0 12px;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.star-chip span{font-size:11px;color:var(--muted);font-weight:800}
.icon-btn,.sound-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 11px;font-size:12px;font-weight:900;transition:transform .2s var(--ease)}
.parent-btn{display:inline-flex;align-items:center;gap:6px;padding:0 13px;background:var(--ink);color:#fff;font-size:12px;font-weight:900;box-shadow:0 6px 16px rgba(32,52,45,.18)}
.pb-short{display:none}
.authorbar{
  position:fixed;left:0;right:0;bottom:0;height:var(--bottom);z-index:80;
  background:rgba(255,254,250,.92);backdrop-filter:blur(20px) saturate(1.6);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
.author-inner{max-width:1180px;height:100%;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:10px}
.author-photo{width:42px;height:42px;border-radius:13px;flex:none;background:#E7F3E7;box-shadow:0 0 0 2px #fff,0 4px 12px rgba(32,52,45,.15)}
.author-meta{min-width:0;line-height:1.25}
.author-meta b{display:block;font-size:13px;font-weight:900}
.author-meta span{display:block;font-size:10px;font-weight:750;color:var(--muted);margin-top:1px}
.author-line{flex:1}
.author-tag{display:inline-flex;align-items:center;gap:5px;background:var(--primary-soft);color:var(--primary-d);font-size:10px;font-weight:900;padding:6px 10px;border-radius:999px;white-space:nowrap}
.app{max-width:1180px;margin:0 auto;padding:0 15px}
.page-head{display:flex;align-items:flex-start;gap:10px;margin:0 0 18px}
.head-main{min-width:0;flex:1}
.eyebrow{margin:0 0 5px;font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--primary)}
h1{margin:0;font-size:clamp(27px,5vw,43px);line-height:1.08;letter-spacing:-.025em;font-weight:900}
h1 span{display:block;font-size:clamp(13px,2.4vw,18px);color:var(--ink-2);margin-top:5px;letter-spacing:0}
.head-sub{margin:8px 0 0;max-width:680px;color:var(--ink-2);font-size:13px;line-height:1.7;font-weight:650}
.back-btn,.ghost-btn{
  height:38px;padding:0 13px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:12px;font-weight:900;color:var(--ink-2);box-shadow:0 3px 10px rgba(37,75,57,.05);white-space:nowrap
}
.back-btn:hover,.ghost-btn:hover{border-color:rgba(52,168,83,.35);transform:translateY(-1px)}
.btn-big{
  height:52px;padding:0 24px;border-radius:999px;background:var(--primary);color:#fff;
  font-size:17px;font-weight:900;box-shadow:0 12px 24px rgba(52,168,83,.24);transition:transform .2s var(--ease)
}
.btn-big:hover{background:#31A04F;transform:translateY(-2px)}
.map{position:relative;padding:10px 0 20px}
.map-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map-lines path{fill:none;stroke:rgba(52,168,83,.25);stroke-width:3;stroke-linecap:round;stroke-dasharray:7 9}
.map-grid{position:relative;display:grid;grid-template-columns:260px minmax(0,1fr) 260px;gap:18px;align-items:center}
.center-card{
  grid-column:2;grid-row:2/4;position:relative;z-index:2;min-height:280px;border-radius:var(--r-xl);
  background:linear-gradient(160deg,#fff,#F2FBF4);border:1px solid rgba(52,168,83,.18);
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:26px
}
.center-emoji{width:98px;height:98px;border-radius:32px;background:var(--primary-soft);display:grid;place-items:center;font-size:50px;margin-bottom:15px}
.center-card h2{margin:0;font-size:clamp(24px,4vw,36px);line-height:1.15;font-weight:900;letter-spacing:-.02em}
.center-card p{margin:8px 0 0;color:var(--ink-2);font-size:13px;font-weight:700}
.center-stars{margin-top:16px;display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);padding:8px 13px;border-radius:999px;font-size:14px;font-weight:900}
.unit-card{
  position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:15px;transition:transform .25s var(--ease),box-shadow .25s var(--ease)
}
.unit-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.uc-head{display:flex;align-items:center;gap:8px}
.uc-no{width:35px;height:35px;border-radius:12px;background:var(--as);color:var(--a);display:grid;place-items:center;font-size:14px;font-weight:900;flex:none}
.uc-head h3{margin:0;font-size:16px;font-weight:900;min-width:0}
.uc-head p{margin:2px 0 0;font-size:10px;font-weight:750;color:var(--muted);white-space:nowrap}
.uc-emoji{margin-left:auto;font-size:25px}
.leaves{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.leaves.one{grid-template-columns:1fr}
.leaf{
  min-height:62px;border-radius:16px;background:var(--as);border:1px solid transparent;text-align:left;
  padding:7px 8px;display:grid;gap:3px;transition:transform .2s var(--ease),background .2s
}
.leaf:hover{transform:translateY(-2px);background:#fff}
.lf-emoji{font-size:19px;line-height:1}
.leaf b{font-size:12px;font-weight:900;line-height:1.25}
.leaf i{font-style:normal;font-size:10px;color:var(--ink-2);font-weight:750}
.uc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px}
.uc-stars{font-size:12px;font-weight:900}
.uc-go{height:31px;padding:0 11px;border-radius:999px;background:var(--as);color:var(--a);font-size:11px;font-weight:900}
.segment{display:flex;gap:6px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:999px;margin:0 0 13px;overflow-x:auto}
.seg-btn{height:36px;padding:0 15px;border-radius:999px;font-size:13px;font-weight:900;color:var(--ink-2);white-space:nowrap}
.seg-btn[aria-selected="true"]{background:var(--a);color:#fff}
.lesson-shell{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:18px}
.lesson-visual{
  border-radius:var(--r-lg);background:linear-gradient(160deg,var(--as),#fff);
  padding:25px;text-align:center;font-size:clamp(40px,10vw,82px);line-height:1.25;letter-spacing:.04em
}
.lesson-visual small{display:block;font-size:13px;font-weight:900;color:var(--ink-2);letter-spacing:0;margin-top:12px}
.point-pills{display:flex;gap:6px;overflow-x:auto;padding:3px 0 13px;scrollbar-width:none}
.point-pills::-webkit-scrollbar{display:none}
.point-pill{height:34px;padding:0 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:900;color:var(--ink-2);white-space:nowrap}
.point-pill[aria-current="true"]{background:var(--a);color:#fff;border-color:transparent}
.lesson-body h2{margin:14px 0 6px;font-size:24px;font-weight:900}
.lesson-body .speech-row{display:flex;align-items:center;gap:7px;justify-content:space-between;margin-top:14px}
.speech-btn{height:40px;border-radius:999px;background:var(--primary-soft);color:var(--primary-d);padding:0 13px;font-size:12px;font-weight:900}
.steps{margin:12px 0 0;padding-left:22px;color:var(--ink-2);font-size:14px;line-height:1.9;font-weight:620}
.tip-box,.example-box{margin-top:14px;border-radius:var(--r);padding:14px 15px;font-size:14px;line-height:1.75;font-weight:700}
.tip-box{background:#FFF6DE;border:1px solid #F5DFA5}
.example-box{background:#EAF3FF;border:1px solid #C9DDF5}
.tip-box b,.example-box b{display:block;margin-bottom:5px;color:var(--ink)}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;margin-top:17px}
.game-shell{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:18px}
.game-intro{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;background:linear-gradient(140deg,var(--as),#fff);border-radius:var(--r-xl);padding:22px}
.gi-emoji{width:110px;height:110px;border-radius:34px;background:#fff;display:grid;place-items:center;font-size:56px;box-shadow:var(--shadow)}
.game-intro h2{margin:0;font-size:27px;font-weight:900}
.game-intro p{margin:8px 0 0;color:var(--ink-2);font-size:13px;line-height:1.7;font-weight:660}
.game-rules{margin:13px 0 0;padding-left:20px;color:var(--ink-2);font-size:12px;line-height:1.8;font-weight:700}
.game-intro .btn-big{margin-top:16px}
.game-hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.hud-chip{height:34px;padding:0 12px;border-radius:999px;background:var(--as);color:var(--a);display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:900}
.game-hud .top-spacer{flex:1}
.progress{height:11px;border-radius:999px;background:#ECF1EA;overflow:hidden;flex:1;min-width:110px}
.progress i{display:block;height:100%;background:var(--a);transition:width .35s var(--ease)}
.question{
  border-radius:var(--r-lg);background:linear-gradient(160deg,var(--as),#fff);padding:20px;text-align:center
}
.question p{margin:0;font-size:24px;font-weight:900;line-height:1.45}
.question .say-again{margin-top:11px}
.game-stage{display:grid;gap:13px;margin-top:15px}
.assign-items,.build-items{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}
.assign-item{
  width:57px;height:57px;border-radius:20px;background:#fff;border:2px solid var(--line);font-size:28px;
  display:grid;place-items:center;transition:transform .2s var(--ease),border-color .2s
}
.assign-item[data-owner="0"]{border-color:#B7D8F3;background:#F3F9FF}
.assign-item[data-owner="1"]{border-color:#F4C9A6;background:#FFF8F1}
.assign-targets{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.assign-target{border:2px dashed var(--line);border-radius:var(--r);padding:16px;background:#fff;text-align:center}
.assign-target.selected{border-color:var(--a);background:var(--as)}
.assign-target .who{font-size:38px}
.assign-target b{display:block;margin-top:6px;font-size:14px}
.place-zones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.place-zone{border:2px solid var(--line);border-radius:var(--r);background:#fff;padding:16px 8px;text-align:center;min-height:112px}
.place-zone.selected{border-color:var(--a);background:var(--as)}
.place-zone .icon{font-size:35px;display:block}
.place-zone b{display:block;margin-top:6px;font-size:13px}
.place-zone .count{display:block;margin-top:8px;font-size:20px;font-weight:900}
.catch-field{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.mole{
  min-height:104px;border-radius:var(--r);background:#EAF7EC;border:2px solid #CBE5D0;display:grid;place-items:center;
  font-size:34px;font-weight:900;transition:transform .2s var(--ease)
}
.mole:hover{transform:translateY(-3px);background:#fff}
.mole .emoji{display:block;font-size:34px;line-height:1;margin-bottom:4px}
.sort-bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sort-bin{border:2px dashed var(--line);border-radius:var(--r);background:#fff;padding:15px 8px;text-align:center}
.sort-bin.selected{border-color:var(--a);background:var(--as)}
.sort-bin .icon{font-size:34px;display:block}
.sort-bin b{display:block;margin-top:6px;font-size:14px}
.sort-card{border-radius:var(--r);background:var(--as);padding:15px;text-align:center;font-size:27px;font-weight:900}
.simulate-panel{display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:center}
.sim-stage{border-radius:var(--r);background:#F5FAFF;border:2px solid #D8E8F6;padding:18px;text-align:center;min-height:145px}
.sim-stage .sim-emoji{font-size:29px;line-height:1.5}
.sim-controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.number-btn{width:48px;height:48px;border-radius:17px;background:#fff;border:2px solid var(--line);font-size:20px;font-weight:900}
.answer-row{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:14px}
.answer-input{
  width:112px;height:58px;border-radius:20px;border:2px solid var(--line);background:#fff;text-align:center;
  font-size:28px;font-weight:900;-moz-appearance:textfield
}
.answer-input::-webkit-outer-spin-button,.answer-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.game-feedback{text-align:center;margin-top:13px;min-height:25px;font-size:14px;font-weight:900}
.game-feedback.ok{color:var(--primary-d)}
.game-feedback.no{color:#C24B32}
.result{display:grid;place-items:center;text-align:center;padding:25px}
.result-emoji{font-size:64px}
.result h2{margin:10px 0 6px;font-size:33px}
.result p{margin:0;color:var(--ink-2);font-size:14px;font-weight:700}
.stars{font-size:41px;letter-spacing:5px;margin:15px 0}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.modal-back{
  position:fixed;inset:0;z-index:100;background:rgba(35,48,42,.36);backdrop-filter:blur(7px);
  display:grid;place-items:center;padding:18px
}
.modal{
  width:min(760px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:var(--r-xl);
  box-shadow:var(--shadow-lg);padding:20px
}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.modal-head h2{margin:0;font-size:25px}
.modal-close{width:38px;height:38px;border-radius:50%;background:#F1F4F0;font-size:17px;font-weight:900}
.gate{display:grid;place-items:center;text-align:center;gap:10px}
.gate p{margin:0;color:var(--ink-2);font-size:14px;font-weight:750}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#F7FAF5;border:1px solid var(--line);border-radius:var(--r);padding:15px;text-align:center}
.stat b{display:block;font-size:27px;font-weight:900}
.stat span{display:block;margin-top:5px;font-size:10.5px;color:var(--muted);font-weight:850}
.parent-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px}
.parent-table th,.parent-table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.parent-table th{font-size:10.5px;color:var(--muted);font-weight:900}
.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:10.5px;font-weight:900}
.s4{background:#DFF4E5;color:#237242}.s3{background:#E8F3FF;color:#28669D}.s2{background:#FFF3D7;color:#8A6412}.s1{background:#F1F3F0;color:#667067}
.danger-btn{height:44px;border-radius:999px;background:#FDECEC;color:#B4392F;padding:0 17px;font-size:13px;font-weight:900}
.toast{
  position:fixed;left:50%;bottom:calc(var(--bottom) + 14px);transform:translate(-50%,20px);z-index:120;
  background:rgba(34,49,42,.94);color:#fff;padding:11px 16px;border-radius:999px;font-size:12px;font-weight:850;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88vw
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;z-index:110;pointer-events:none}
@media (max-width:820px){
  :root{--top:68px;--bottom:62px}
  .brand-sub,.pb-full,.star-chip span{display:none}
  .pb-short{display:inline}
  .map-grid{display:flex;flex-direction:column;gap:12px}
  .center-card{min-height:auto;width:100%;grid-column:auto;grid-row:auto}
  .center-emoji{width:78px;height:78px;font-size:39px;border-radius:26px}
  .unit-card{width:100%}
  .leaves{grid-template-columns:1fr}
  .game-intro{grid-template-columns:1fr;text-align:center}
  .gi-emoji{margin:0 auto;width:88px;height:88px;font-size:44px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .simulate-panel{grid-template-columns:1fr}
  .parent-table{display:block;overflow-x:auto}
  .parent-table table{min-width:620px}
  .question p{font-size:19px}
}
@media (max-width:430px){
  .sound-text{display:none}
  .app{padding:0 10px}
  .lesson-shell,.game-shell{padding:13px;border-radius:28px}
  .lesson-visual{padding:18px}
  .assign-item{width:48px;height:48px;font-size:23px}
  .place-zones,.sort-bins,.catch-field{grid-template-columns:1fr 1fr}
  .author-tag{display:none}
  .head-sub{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" id="brandHome" type="button" aria-label="回到学习地图">
      <span class="brand-logo" aria-hidden="true">🌈</span>
      <span class="brand-text"><span class="brand-name">优优教育</span><span class="brand-sub">10以内加与减</span></span>
    </button>
    <span class="top-spacer"></span>
    <div class="star-chip" id="starChip">⭐ <b id="starTotal">0</b><span>/ 18</span></div>
    <button class="sound-btn" id="soundBtn" type="button" aria-pressed="true"><span id="soundIcon">🔊</span><span class="sound-text" id="soundText">声音</span></button>
    <button class="parent-btn" id="parentBtn" type="button">👨‍👩‍👧 <span class="pb-full">家长中心</span><span class="pb-short">家长</span></button>
  </div>
</header>
<main class="app" id="app" aria-live="polite"></main>
<footer class="authorbar">
  <div class="author-inner">

<script>
"use strict";
const UNITS=[
  {id:"u1",no:1,title:"认识10以内数",en:"Numbers to 10",icon:"🔢",accent:"#4B9764",soft:"#E6F4E8",game:{type:"place",name:"小动物回家",emoji:"🏠",typeName:"摆放型",desc:"听题目，把小动物放到正确的位置。",rules:["每局9题","点位置放小动物","点完检查"]},
   points:[
     {id:"u1p1",emoji:"🍎🍎🍎🍎",short:"数一数",cn:"1—10数数",steps:["看着一堆苹果，用手指点一个数一个，口里说一、二、三。手点得慢一点，眼睛跟着手走，这样不会漏数。","数到最后一个，嘴巴说出的数就是总数。比如数到五，就说一共有5个苹果。","数完可以再数一遍，两次答案一样，才说明数对了。"],tip:"点一个，数一个，最后说的数就是总数。",example:"盘子里有5个苹果，你点着数：1、2、3、4、5，所以一共有5个。"},
     {id:"u1p2",emoji:"5️⃣ 6️⃣",short:"认数字",cn:"数字与数量",steps:["数字是数的名字。看到5，就想一只手有5根手指；看到8，就想8颗小星星。","可以先用小棒摆一摆，再写下数字。摆的数量和数字对上，孩子就明白数字不是随便画的。","每天读数字卡，读一个摆一个，慢慢把0到10都认熟。"],tip:"数字几，就摆几个小东西。",example:"看到数字7，就摆7支铅笔，一边摆一边说：7支铅笔。"},
     {id:"u1p3",emoji:"0️⃣ 🥚",short:"认识0",cn:"0表示没有",steps:["0表示一个也没有。篮子里没有鸡蛋，就说有0个鸡蛋。","0不是没有用，它是数数起点，也是尺子开头的数。站队时从0开始数，一步一步往前走。","看见0不要读成字母O，要读成零。"],tip:"什么都没有，就用0表示。",example:"小猴子把香蕉全吃完了，盘子里剩下0根香蕉。"},
     {id:"u1p4",emoji:"3️⃣<9️⃣",short:"比大小",cn:"多与少",steps:["先数出两组东西各有几个，再比较。嘴巴说：3比5少，5比3多。","可以用符号表示：小于号像张开的嘴巴，开口朝着大数；大于号也朝大数。","比的时候不要只看谁占的地方大，一定要先数一数。"],tip:"开口朝大数，尖尖朝小数。",example:"左边3颗糖，右边5颗糖，5多3少，写作3<5。"}
   ]},
  {id:"u2",no:2,title:"分与合",en:"Make & Break",icon:"🧩",accent:"#3F8EA8",soft:"#E8F4FA",game:{type:"assign",name:"分苹果",emoji:"🍎",typeName:"分配型",desc:"把苹果分给两只小熊，每只一样多。",rules:["每局9题","点苹果换主人","分完检查"]},
   points:[
     {id:"u2p1",emoji:"🧸🍎🧸",short:"平均分",cn:"同样多",steps:["平均分就是每个人都一样多。先给左边一只小熊一个，再给右边一只小熊一个，轮流发。","发到最后，两边数量一样，就说分好了。比如4个苹果，每只小熊分2个。","分完后两边各数一遍，都是同样多才对。"],tip:"你一个，我一个，轮流分就一样多。",example:"4块饼干分给两个人，每人2块，谁也不多，谁也不少。"},
     {id:"u2p2",emoji:"5=2+3",short:"数的分合",cn:"5的分解",steps:["5可以分成2和3，也可以分成1和4。摆5颗豆子，往两边推开，就能看见两种分法。","分完再合回去，说一说：2和3合成5，1和4也合成5。","一变二，二合一，玩熟了以后算加法减法就快。"],tip:"分一分，合一合，数字朋友记心里。",example:"5颗糖分成2颗和3颗，装进两个口袋。"},
     {id:"u2p3",emoji:"7=3+4",short:"6—10分合",cn:"大数分合",steps:["先摆出总数，再把它分成两堆。","从10开始最好记：10可以分成1和9、2和8、3和7、4和6、5和5。每天说一组，像唱歌一样记。","发现一边变多，另一边就变少。"],tip:"总数不变，一边多，一边少。",example:"10颗星星分成3颗和7颗，两边合起来还是10。"}
   ]},
  {id:"u3",no:3,title:"5以内加法",en:"Add to 5",icon:"➕",accent:"#D08A3D",soft:"#FFF4E5",game:{type:"catch",name:"打地鼠",emoji:"🔨",typeName:"捕捉型",desc:"地鼠举着答案出现，敲中正确的那个。",rules:["每局9题","看题听题","点正确答案"]},
   points:[
     {id:"u3p1",emoji:"2➕1=3",short:"加法含义",cn:"合起来",steps:["加法就是把两堆东西合起来。先摆2块积木，再摆1块，全部推到一起数一数。","合起来是3块，就写作2+1=3。加号像一个小十字，说“加上”。","算完后可以再数一遍总数，确认没有漏。"],tip:"加法就是合起来，合完再数总数。",example:"先吃2颗葡萄，又吃1颗，一共吃了3颗。"},
     {id:"u3p2",emoji:"1➕4",short:"看图列式",cn:"图变算式",steps:["看图先说故事：左边有1只鸭，右边有4只鸭。问一共有几只，就把两个数相加。","写算式时，前面的数和图对应，加号后面写另一部分。算式是1+4=5。","也可以交换：4+1=5，答案一样。"],tip:"看图先说故事，再把数加起来。",example:"树上有2只鸟，又飞来3只，一共有5只。"},
     {id:"u3p3",emoji:"3️⃣ 2️⃣ 5️⃣",short:"5以内口算",cn:"快速加",steps:["先记住分与合：1和4合成5，2和3也合成5。看到2+3，就想到合成5。","口算时先在心里想总数，再说出答案。不要急着猜，想清楚再答。","每天练5分钟，先慢后快。"],tip:"想分合，算加法。",example:"2+2，想2和2合成4，所以答案是4。"}
   ]},
  {id:"u4",no:4,title:"5以内减法",en:"Subtract to 5",icon:"➖",accent:"#C46990",soft:"#FDEEF5",game:{type:"sort",name:"送快递",emoji:"📦",typeName:"归类型",desc:"把算式快递送到正确答案的货架。",rules:["每局9题","先看算式","点正确货架"]},
   points:[
     {id:"u4p1",emoji:"3➖1=2",short:"减法含义",cn:"拿走",steps:["减法就是从总数里拿走一部分。摆3块积木，拿走1块，看看还剩几块。","还剩2块，写作3-1=2。减号像一条小横线，说“减去”。","拿走后要重新数剩下的，不要凭感觉说答案。"],tip:"减法就是拿走，剩下多少再数一数。",example:"盘里有4块饼干，吃掉1块，还剩3块。"},
     {id:"u4p2",emoji:"5➖2",short:"看图列式",cn:"图变算式",steps:["看图先找总数。原来有5个气球，飞走2个，总数写在前。","飞走的写后面：5-2=3。总数减去飞走的，就是剩下的。","看到添上用加法，看到飞走或吃掉用减法。"],tip:"总数在前，去掉在后。",example:"原来有5只蝴蝶，飞走2只，还剩3只。"},
     {id:"u4p3",emoji:"4➖0=4",short:"5以内口算",cn:"快速减",steps:["减0等于没拿走，答案还是原来的数。减1就是去掉一个，4-1=3。","可以用手指帮忙：伸出5根，弯下2根，剩下3根。","练熟后不用手指，直接想分合。"],tip:"减0不变，减1少一。",example:"5颗星星拿走0颗，还是5颗。"}
   ]},
  {id:"u5",no:5,title:"6—10加减法",en:"6 to 10",icon:"🌈",accent:"#8569B8",soft:"#F0EDFA",game:{type:"build",name:"搭彩虹桥",emoji:"🌉",typeName:"建构型",desc:"点击添加彩色积木，搭出题目要的数量。",rules:["每局9题","点加号加积木","数量对了检查"]},
   points:[
     {id:"u5p1",emoji:"6➕3=9",short:"6—10加法",cn:"大数加法",steps:["先摆大数，再接着数小数。算6+3，先摆6个方块，再加1个说7，加1个说8，加1个说9。","接着数比从头数更快。眼睛看着已经有的6个，继续往后数3步。","最后说出算式：6+3=9。"],tip:"大数记住，接着往后数。",example:"盒里有7支笔，再放3支，接着数8、9、10。"},
     {id:"u5p2",emoji:"10➖4",short:"6—10减法",cn:"大数减法",steps:["算10-4，先摆10颗珠子，拿走4颗，再数剩下6颗。","也可以倒着数：从10开始往前数4步，9、8、7、6，答案是6。","拿走多的时候用倒数更方便。"],tip:"减几，就往前数几步。",example:"10颗扣子拿走4颗，往前数4步，剩6颗。"},
     {id:"u5p3",emoji:"4➕3➖2",short:"连加连减",cn:"一步步算",steps:["连加连减要一步一步算。先算4+3=7，再用7-2=5。","每次算完，把中间答案写在下面或记在心里，不能一步跳到底。","读题时按顺序念，念一步算一步。"],tip:"先算前两个，再算第三个。",example:"车上4人，上来3人，又下去2人，最后5人。"}
   ]},
  {id:"u6",no:6,title:"生活小应用",en:"Mixed Problems",icon:"🏪",accent:"#5285A2",soft:"#EAF4F8",game:{type:"simulate",name:"小超市收银",emoji:"🧮",typeName:"操作模拟型",desc:"拨一拨小算珠，再输入最终答案。",rules:["每局9题","先操作道具","再输入答案"]},
   points:[
     {id:"u6p1",emoji:"➕➖",short:"加减混合",cn:"先来后走",steps:["加减混合题，先找事情顺序。先来了几人用加法，后走了几人用减法。","比如3+2-1，先算3+2=5，再算5-1=4。写小步骤最稳。","做完可以画小人，看看答案合不合道理。"],tip:"按顺序，一步一步算。",example:"教室先来3人，又来2人，走1人，现在4人。"},
     {id:"u6p2",emoji:"🍎❓",short:"求部分数",cn:"还剩多少",steps:["知道总数和一部分，求另一部分用减法。一共有8个苹果，吃了3个，求剩下几个。","算式是8-3=5。总数写在前面，知道的一部分写在后面。","可以摆8个小圆片，拿走3个验证。"],tip:"求剩下，用总数减去拿走的。",example:"8块橡皮用掉3块，还剩5块。"},
     {id:"u6p3",emoji:"🎯9",short:"求总数",cn:"一共有多少",steps:["把两部分合起来，用加法。左边4只猫，右边5只猫，一共有9只。","先说故事，再列式：4+5=9。最后检查答案要比每一部分都大。","如果答案比原来还小，就知道错了。"],tip:"求一共，就把两部分加起来。",example:"买4支铅笔又买5支，一共9支。"},
     {id:"u6p4",emoji:"🏆",short:"综合闯关",cn:"混合挑战",steps:["做题先读题，想清楚是来还是走、合还是剩。来和合用加法，走和剩用减法。","然后列算式，最后用小棒或手指验证。答案要回到题目里说一遍，看看合不合生活。","每天混练几题，比只练一种更能提升理解。"],tip:"先想事情，再选加减。",example:"盒里有9颗糖，拿走2颗又放进1颗，现在是8颗。"}
   ]}
];
const GAME_TYPE_CN={assign:"分配型",place:"摆放型",catch:"捕捉型",sort:"归类型",build:"建构型",simulate:"操作模拟型"};
const STORE_KEY="youyou_math10_v1";
let store={stars:{},plays:{},best:{},last:{},totalGames:0,lastStudy:0,sound:true};
try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||"{}");if(saved&&typeof saved==="object")store=Object.assign(store,saved)}catch(error){}
let gameData=null,selectedOwner=0,selectedBin=null,buildCount=0,simCount=0,clearArmed=false;
const app=document.getElementById("app"),modalRoot=document.getElementById("modalRoot");
const esc=text=>String(text).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(store))}catch(error){toast("浏览器暂存不可用，进度可能无法保存")}}
function totalStars(){return UNITS.reduce((sum,unit)=>sum+(store.stars[unit.id]||0),0)}
function unitOf(id){return UNITS.find(unit=>unit.id===id)}
function starsTxt(stars){return "★".repeat(stars)+"☆".repeat(Math.max(0,3-stars))}
function fmtTime(value){if(!value)return"还没开始";const date=new Date(value),pad=num=>String(num).padStart(2,"0");return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`}
function toast(text){const node=document.getElementById("toast");node.textContent=text;node.classList.add("show");clearTimeout(node._timer);node._timer=setTimeout(()=>node.classList.remove("show"),2600)}
function route(){const raw=location.hash.replace(/^#\/?/,""),parts=raw.split("/").filter(Boolean);if(parts[0]==="unit"&&parts[1]){const unit=unitOf(parts[1]);if(unit){let index=parseInt(parts[3]||"0",10);if(Number.isNaN(index)||index<0||index>=unit.points.length)index=0;return{name:"unit",unit,tab:parts[2]==="game"?"game":"study",index}}}return{name:"map"}}
function go(hash){const target="#"+hash;if(location.hash===target)render();else location.hash=target}
function render(){stopSpeech();closeModal();const current=route();if(current.name==="map")renderMap();else renderUnit(current.unit,current.tab,current.index);document.getElementById("starTotal").textContent=totalStars();window.scrollTo({top:0,behavior:"auto"})}
window.addEventListener("hashchange",()=>{gameData=null;render()});
document.getElementById("brandHome").addEventListener("click",()=>{sfx.click();go("/map")});
document.getElementById("soundBtn").addEventListener("click",()=>{store.sound=!store.sound;save();paintSound();if(store.sound){sfx.click();speakText("声音打开了")}});
document.getElementById("parentBtn").addEventListener("click",()=>{sfx.click();renderParentGate()});
function paintSound(){document.getElementById("soundBtn").setAttribute("aria-pressed",String(store.sound));document.getElementById("soundIcon").textContent=store.sound?"🔊":"🔇";document.getElementById("soundText").textContent=store.sound?"声音":"静音"}
paintSound();
function mapLine(x1,y1,x2,y2){return `<path d="M${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}">`}
function renderMap(){
  const columns=[[],[],[],[],[],[]];UNITS.forEach((unit,index)=>columns[index<3?0:1].push(unit));
  app.innerHTML=`<header class="page-head"><div class="head-main"><p class="eyebrow">北师大版 · 一年级上册</p><h1>10以内数的加与减 <span>从数数到生活应用，一共20片知识叶子</span></h1><p class="head-sub">点任意知识叶子先学一学，点“玩一玩”挑战小游戏。所有讲解和题目都会自动读出来。</p></div><button class="ghost-btn" id="helpBtn">玩法说明</button></header>
  <section class="map" aria-label="思维导图学习地图"><svg class="map-lines" viewBox="0 0 1000 760" preserveAspectRatio="none" aria-hidden="true">${mapLine(500,250,220,100)}${mapLine(500,250,780,100)}${mapLine(500,410,220,300)}${mapLine(500,410,780,300)}${mapLine(500,510,220,570)}${mapLine(500,510,780,570)}</svg>
  <div class="map-grid">
    <div style="grid-column:1;grid-row:1">${unitCard(UNITS[0])}</div><div style="grid-column:1;grid-row:2">${unitCard(UNITS[1])}</div><div style="grid-column:1;grid-row:3">${unitCard(UNITS[2])}</div>
    <article class="center-card"><div class="center-emoji">🌈</div><h2>10以内加与减</h2><p>一年级上册 · 数学</p><div class="center-stars">⭐ ${totalStars()} / 18 颗星</div></article>
    <div style="grid-column:3;grid-row:1">${unitCard(UNITS[3])}</div><div style="grid-column:3;grid-row:2">${unitCard(UNITS[4])}</div><div style="grid-column:3;grid-row:3">${unitCard(UNITS[5])}</div>
  </div></section>`;
  app.querySelectorAll("[data-unit]").forEach(button=>button.addEventListener("click",()=>{sfx.click();go(`/unit/${button.dataset.unit}/study/${button.dataset.index}`)}));
  app.querySelectorAll("[data-game]").forEach(button=>button.addEventListener("click",()=>{sfx.click();go(`/unit/${button.dataset.game}/game`)}));
  document.getElementById("helpBtn").addEventListener("click",openHelp);
}
function unitCard(unit){const stars=store.stars[unit.id]||0;return `<article class="unit-card" style="--a:${unit.accent};--as:${unit.soft}"><div class="uc-head"><span class="uc-no">0${unit.no}</span><div><h3>${esc(unit.title)}</h3><p>${esc(unit.en)}</p></div><span class="uc-emoji">${unit.icon}</span></div><div class="leaves">${unit.points.map((point,index)=>`<button class="leaf" type="button" data-unit="${unit.id}" data-index="${index}" aria-label="学习${esc(point.cn)}"><span class="lf-emoji">${point.emoji}</span><b>${esc(point.short)}</b><i>${esc(point.cn)}</i></button>`).join("")}</div><div class="uc-foot"><span class="uc-stars">${starsTxt(stars)} ${stars}/3</span><button class="uc-go" type="button" data-game="${unit.id}">玩一玩 →</button></div></article>`}
function renderUnit(unit,tab,index){
  const point=unit.points[index];
  app.innerHTML=`<header class="page-head"><button class="back-btn" id="backMap">← 学习地图</button><div class="head-main"><p class="eyebrow">第 ${unit.no} 单元</p><h1>${esc(unit.title)} <span>${esc(point.cn)}</span></h1></div></header>
  <div class="segment" role="tablist"><button class="seg-btn" role="tab" id="tabStudy" aria-selected="${tab==="study"}">📖 学一学</button><button class="seg-btn" role="tab" id="tabGame" aria-selected="${tab==="game"}">🎮 玩一玩</button></div>
  ${tab==="study"?lessonHtml(unit,index):gameHtml(unit)}`;
  document.getElementById("backMap").addEventListener("click",()=>{sfx.click();go("/map")});
  document.getElementById("tabStudy").addEventListener("click",()=>{sfx.click();go(`/unit/${unit.id}/study/${index}`)});
  document.getElementById("tabGame").addEventListener("click",()=>{sfx.click();go(`/unit/${unit.id}/game`)});
  if(tab==="study")bindLesson(unit,index);else bindGame(unit);
}
function lessonHtml(unit,index){
  const point=unit.points[index];
  return `<section class="lesson-shell"><div class="point-pills">${unit.points.map((item,i)=>`<button class="point-pill" type="button" data-index="${i}" aria-current="${i===index}">${i+1}. ${esc(item.short)}</button>`).join("")}</div>
  <div class="lesson-body"><div class="lesson-visual" aria-hidden="true">${point.emoji}<small>${esc(point.cn)}</small></div><h2>${esc(point.short)} · ${esc(point.cn)}</h2>
  <div class="speech-row"><span class="eyebrow">细致讲解</span><button class="speech-btn" id="readLesson" type="button">🔊 再读一遍</button></div><ol class="steps">${point.steps.map(step=>`<li>${esc(step)}</li>`).join("")}</ol>
  <div class="tip-box"><b>💡 小妙招</b>${esc(point.tip)}</div><div class="example-box"><b>🌰 举个例子</b>${esc(point.example)}</div>
  <div class="lesson-nav"><button class="back-btn" id="prevPoint" ${index===0?"disabled":""}>上一个</button><button class="btn-big" id="nextPoint">${index===unit.points.length-1?"去玩一玩 →":"下一个 →"}</button></div></div></section>`;
}
function bindLesson(unit,index){const point=unit.points[index];
  app.querySelectorAll(".point-pill").forEach(button=>button.addEventListener("click",()=>{sfx.click();go(`/unit/${unit.id}/study/${button.dataset.index}`)}));
  document.getElementById("prevPoint").addEventListener("click",()=>{sfx.click();if(index>0)go(`/unit/${unit.id}/study/${index-1}`)});
  document.getElementById("nextPoint").addEventListener("click",()=>{sfx.click();if(index<unit.points.length-1)go(`/unit/${unit.id}/study/${index+1}`);else go(`/unit/${unit.id}/game`)});
  document.getElementById("readLesson").addEventListener("click",()=>{sfx.click();speakLesson(unit,index)});
  speakLesson(unit,index);
}
function lessonSpeech(unit,index){const point=unit.points[index];return `${unit.title}。${point.cn}。${point.steps.join(" ")} 小妙招：${point.tip}。举个例子：${point.example}`}
function speakLesson(unit,index){speakText(lessonSpeech(unit,index),{rate:.6,pitch:1.04})}
function numberSpeech(value){return String(value).replace(/\d/g,digit=>"零一二三四五六七八九"[Number(digit)])}
function gameHtml(unit){const game=unit.game,stars=store.stars[unit.id]||0;return `<section class="game-shell"><div class="game-intro"><div class="gi-emoji">${game.emoji}</div><div><p class="eyebrow">${esc(game.typeName)} · 第 ${unit.no} 单元</p><h2>${esc(game.name)}</h2><p>${esc(game.desc)}</p><ul class="game-rules">${game.rules.map(rule=>`<li>${esc(rule)}</li>`).join("")}</ul><button class="btn-big" id="startGame">开始玩 →</button></div></div><div class="game-hud"><span class="hud-chip">⭐ ${starsTxt(stars)} ${stars}/3</span><span class="top-spacer"></span><div class="progress"><i id="gameProgress"></i></div><span class="hud-chip" id="gameCount">0 / 9</span></div><div id="gameStage"></div><div class="game-feedback" id="gameFeedback"></div></section>`}
function bindGame(unit){document.getElementById("startGame").addEventListener("click",()=>{sfx.click();startGame(unit)})}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function uniqueChoice(answer,min,max,count){const choices=new Set([answer]);while(choices.size<count){let choice=randInt(min,max);if(choice!==answer)choices.add(choice)}return [...choices].sort(()=>Math.random()-.5)}
function makeQuestions(unit){
  const list=[];for(let i=0;i<9;i++){
    if(unit.id==="u1"){const total=randInt(1,10);list.push({type:"place",speech:`把${numberSpeech(total)}只小鸭放到池塘。请点池塘${numberSpeech(total)}次。`,target:total,zones:[{icon:"🏠",name:"屋子"},{icon:"🪺",name:"鸟窝"},{icon:"🌊",name:"池塘"}],targetIndex:2})}
    if(unit.id==="u2"){const each=randInt(1,5);list.push({type:"assign",each,total:each*2,items:Array(each*2).fill("🍎"),speech:`把${numberSpeech(each*2)}个苹果分给两只小熊，每只分${numberSpeech(each)}个。先点小熊，再点苹果。`})}
    if(unit.id==="u3"){const a=randInt(1,4),b=randInt(1,5-a);list.push({type:"catch",text:`${a} + ${b} = ?`,answer:a+b,choices:uniqueChoice(a+b,2,6,4),speech:`${numberSpeech(a)}加${numberSpeech(b)}等于几？请点正确的地鼠。`})}
    if(unit.id==="u4"){const a=randInt(2,5),b=randInt(1,a-1);list.push({type:"sort",text:`${a} - ${b}`,answer:a-b,choices:uniqueChoice(a-b,0,5,3),speech:`${numberSpeech(a)}减${numberSpeech(b)}等于几？请点正确的货架。`})}
    if(unit.id==="u5"){const total=randInt(6,10),part=randInt(2,total-2);list.push({type:Math.random()<.5?"build":"build",target:total,speech:Math.random()<.5?`搭一座${numberSpeech(total)}块积木的彩虹桥。点加号，把数量凑到${numberSpeech(total)}。`:`一共有${numberSpeech(total)}颗星星，先摆${numberSpeech(part)}颗，还要再添几颗？点加号试试。`,start:Math.random()<.5?0:part})}
    if(unit.id==="u6"){const a=randInt(2,8),b=randInt(1,10-a),op=Math.random()<.5?"+":"-",answer=op==="+"?a+b:a-b;list.push({type:"simulate",text:op==="+"?`${a} + ${b} = ?`:`${a} - ${b} = ?`,answer,speech:op==="+"?`小超市有${numberSpeech(a)}件商品，又进货${numberSpeech(b)}件。拨一拨算珠，再输入答案。`:`小超市有${numberSpeech(a)}件商品，卖出${numberSpeech(b)}件。拨一拨算珠，再输入答案。`,start:op==="+"?a:0,target:answer})}
  }return list}
function startGame(unit){gameData={unit,questions:makeQuestions(unit),index:0,correct:0,mode:"play",selection:null};selectedOwner=0;buildCount=gameData.questions[0].start||0;simCount=gameData.questions[0].start||0;renderQuestion()}
function progressPaint(){document.getElementById("gameProgress").style.width=`${((gameData.index+(gameData.mode==="result"?1:0))/9*100).toFixed(1)}%`;document.getElementById("gameCount").textContent=`${gameData.mode==="result"?9:gameData.index+1} / 9`}
function renderQuestion(){
  if(gameData.mode==="result"){renderResult();return}
  const unit=gameData.unit,q=gameData.questions[gameData.index],stage=document.getElementById("gameStage");
  progressPaint();
  let html=`<section class="question"><p>${q.type==="catch"?esc(q.text):q.type==="sort"?esc(q.text)+" = ?":q.type==="simulate"?esc(q.text):esc(q.speech)}</p><button class="speech-btn say-again" id="sayAgain">🔊 再读一遍</button></section>`;
  if(q.type==="place"){html+=`<div class="place-zones">${q.zones.map((zone,index)=>`<button class="place-zone" data-zone="${index}" data-count="0"><span class="icon">${zone.icon}</span><b>${zone.name}</b><span class="count">0</span></button>`).join("")}</div><div class="answer-row"><button class="btn-big" id="checkAnswer">检查</button><button class="ghost-btn" id="resetAnswer">清空</button></div>`}
  if(q.type==="assign"){html+=`<div class="assign-items">${q.items.map((item,index)=>`<button class="assign-item" data-item="${index}" data-owner="-1">${item}</button>`).join("")}</div><div class="assign-targets"><button class="assign-target selected" data-owner="0"><span class="who">🧸</span><b>小熊一</b><span id="owner0">0</span></button><button class="assign-target" data-owner="1"><span class="who">🐼</span><b>小熊二</b><span id="owner1">0</span></button></div><div class="answer-row"><button class="ghost-btn" id="selectOwner0">选小熊一</button><button class="ghost-btn" id="selectOwner1">选小熊二</button><button class="btn-big" id="checkAnswer">检查</button></div>`}
  if(q.type==="catch"){html+=`<div class="catch-field">${q.choices.map(choice=>`<button class="mole" data-answer="${choice}"><span class="emoji">🐹</span>${choice}</button>`).join("")}</div>`}
  if(q.type==="sort"){html+=`<div class="sort-card">${esc(q.text)}</div><div class="sort-bins">${q.choices.map(choice=>`<button class="sort-bin" data-answer="${choice}"><span class="icon">📦</span><b>${choice}</b></button>`).join("")}</div>`}
  if(q.type==="build"){html+=`<div class="build-items">${Array.from({length:buildCount},()=>`<span style="font-size:32px">🧱</span>`).join("")}</div><div class="sim-controls"><button class="number-btn" id="addBlock">➕1</button><button class="number-btn" id="removeBlock">➖1</button><button class="ghost-btn" id="resetAnswer">清空</button><button class="btn-big" id="checkAnswer">检查</button></div>`}
  if(q.type==="simulate"){html+=`<div class="simulate-panel"><div class="sim-stage"><div class="sim-emoji" id="simStage">${Array.from({length:simCount},()=>"🟡").join("") || "0"}</div><p style="margin:8px 0 0;font-size:12px;color:var(--ink-2);font-weight:800" id="simCount">现在 ${simCount} 件</p></div><div class="sim-controls"><button class="number-btn" id="addSim">➕1</button><button class="number-btn" id="removeSim">➖1</button><input class="answer-input" id="simAnswer" type="number" min="0" max="10" inputmode="numeric" placeholder="?" aria-label="输入最终答案"><button class="btn-big" id="checkAnswer">检查</button></div></div>`}
  stage.innerHTML=html;bindQuestion(q);speakText(q.speech,{rate:.6,pitch:1.04});
}
function bindQuestion(q){
  const say=document.getElementById("sayAgain");if(say)say.addEventListener("click",()=>{sfx.click();speakText(q.speech,{rate:.6,pitch:1.04})});
  if(q.type==="place"){app.querySelectorAll(".place-zone").forEach(button=>button.addEventListener("click",()=>{sfx.click();const count=Math.min(10,parseInt(button.dataset.count,10)+1);button.dataset.count=String(count);button.querySelector(".count").textContent=count;app.querySelectorAll(".place-zone").forEach(item=>item.classList.remove("selected"));button.classList.add("selected")}));
  document.getElementById("resetAnswer").addEventListener("click",()=>{sfx.click();app.querySelectorAll(".place-zone").forEach(item=>{item.dataset.count="0";item.querySelector(".count").textContent="0";item.classList.remove("selected")})});
  document.getElementById("checkAnswer").addEventListener("click",()=>{const target=app.querySelector(`.place-zone[data-zone="${q.targetIndex}"]`);judge(parseInt(target.dataset.count,10)===q.target,target.dataset.count)})}
  if(q.type==="assign"){const ownerCounts=[0,0];const paintOwners=()=>{document.getElementById("owner0").textContent=ownerCounts[0];document.getElementById("owner1").textContent=ownerCounts[1]};
  app.querySelectorAll(".assign-item").forEach(button=>button.addEventListener("click",()=>{sfx.click();let owner=parseInt(button.dataset.owner,10);if(owner>=0)ownerCounts[owner]--;owner=(owner+1)%2;ownerCounts[owner]++;button.dataset.owner=String(owner);paintOwners()}));
  [0,1].forEach(owner=>{document.getElementById(`selectOwner${owner}`).addEventListener("click",()=>{sfx.click();selectedOwner=owner;app.querySelectorAll(".assign-target").forEach(item=>item.classList.toggle("selected",item.dataset.owner===String(owner)))})});
  document.getElementById("checkAnswer").addEventListener("click",()=>judge(ownerCounts[0]===q.each&&ownerCounts[1]===q.each,ownerCounts))}
  if(q.type==="catch")app.querySelectorAll(".mole").forEach(button=>button.addEventListener("click",()=>{sfx.click();judge(parseInt(button.dataset.answer,10)===q.answer,button.dataset.answer)}));
  if(q.type==="sort")app.querySelectorAll(".sort-bin").forEach(button=>button.addEventListener("click",()=>{sfx.click();judge(parseInt(button.dataset.answer,10)===q.answer,button.dataset.answer)}));
  if(q.type==="build"){document.getElementById("addBlock").addEventListener("click",()=>{sfx.click();buildCount=Math.min(10,buildCount+1);renderQuestion()});
  document.getElementById("removeBlock").addEventListener("click",()=>{sfx.click();buildCount=Math.max(0,buildCount-1);renderQuestion()});
  document.getElementById("resetAnswer").addEventListener("click",()=>{sfx.click();buildCount=0;renderQuestion()});
  document.getElementById("checkAnswer").addEventListener("click",()=>judge(buildCount===q.target,buildCount))}
  if(q.type==="simulate"){const paint=()=>{document.getElementById("simStage").textContent=Array.from({length:simCount},()=>"🟡").join("")||"0";document.getElementById("simCount").textContent=`现在 ${simCount} 件`};
  document.getElementById("addSim").addEventListener("click",()=>{sfx.click();simCount=Math.min(10,simCount+1);paint()});
  document.getElementById("removeSim").addEventListener("click",()=>{sfx.click();simCount=Math.max(0,simCount-1);paint()});
  document.getElementById("checkAnswer").addEventListener("click",()=>{const value=parseInt(document.getElementById("simAnswer").value,10);judge(value===q.answer,value)})}}
function judge(ok,value){
  const feedback=document.getElementById("gameFeedback");feedback.className="game-feedback "+(ok?"ok":"no");feedback.textContent=ok?"太棒了！准备下一题。":"再想一想，正确答案已经亮出来了。";
  if(ok){gameData.correct++;sfx.correct();speakText("太棒了",{rate:.62,pitch:1.12})}else{sfx.wrong();speakText("再想一想，继续努力",{rate:.6,pitch:1.04});setTimeout(()=>{feedback.textContent=`正确答案是：${gameData.questions[gameData.index].answer !== undefined ? gameData.questions[gameData.index].answer : gameData.questions[gameData.index].target}`;},1000)}
  setTimeout(()=>{gameData.index++;if(gameData.index>=9){finishGame()}else{const q=gameData.questions[gameData.index];buildCount=q.start||0;simCount=q.start||0;renderQuestion()}},ok?800:1800);
}
function finishGame(){const unit=gameData.unit,accuracy=Math.round(gameData.correct/9*100),stars=gameData.correct>=8?3:gameData.correct>=6?2:1;gameData.mode="result";gameData.stars=stars;gameData.accuracy=accuracy;store.plays[unit.id]=(store.plays[unit.id]||0)+1;store.stars[unit.id]=Math.max(store.stars[unit.id]||0,stars);store.best[unit.id]=Math.max(store.best[unit.id]||0,accuracy);store.last[unit.id]=Date.now();store.totalGames++;store.lastStudy=Date.now();save();renderResult();document.getElementById("starTotal").textContent=totalStars();if(stars>=2){sfx.cheer();confettiBurst()}else sfx.correct()}
function renderResult(){const unit=gameData.unit;if(!gameData||gameData.mode!=="result")return;document.getElementById("gameStage").innerHTML=`<section class="result"><div class="result-emoji">${gameData.stars===3?"🏆":"🎉"}</div><h2>${gameData.stars===3?"超级棒！":gameData.stars===2?"很棒！":"继续加油！"}</h2><div class="stars">${starsTxt(gameData.stars)}</div><p>答对 ${gameData.correct}/9 题 · 正确率 ${gameData.accuracy}%</p><div class="result-actions"><button class="btn-big" id="playAgain">再玩一局</button><button class="ghost-btn" id="backStudy">回学一学</button><button class="ghost-btn" id="backMap2">学习地图</button></div></section>`;progressPaint();document.getElementById("playAgain").addEventListener("click",()=>{sfx.click();startGame(unit)});document.getElementById("backStudy").addEventListener("click",()=>{sfx.click();go(`/unit/${unit.id}/study/0`)});document.getElementById("backMap2").addEventListener("click",()=>{sfx.click();go("/map")})}
function openHelp(){showModal(`<div class="modal-head"><h2>玩法说明</h2><button class="modal-close" id="closeModal">✕</button></div><div style="color:var(--ink-2);font-size:14px;line-height:1.9;font-weight:660"><p>1. 点击地图上的知识叶子，先听讲解。</p><p>2. 每个单元可以切换“学一学”和“玩一玩”。</p><p>3. 游戏一局9题，答对6题得2星，答对8题得3星。</p><p>4. 得到2星以上会有撒花庆祝。</p><p>5. 记录保存在这个浏览器里，刷新不会丢。</p></div>`)}
function renderParentGate(){const a=randInt(6,9),b=randInt(6,9),answer=a*b;showModal(`<div class="modal-head"><h2>家长验证</h2><button class="modal-close" id="closeModal">✕</button></div><div class="gate"><p>请家长输入：${a} × ${b} = ?</p><input class="answer-input" id="gateAnswer" type="number" inputmode="numeric" placeholder="答案"><button class="btn-big" id="gateOk">进入家长中心</button></div>`);document.getElementById("gateOk").addEventListener("click",()=>{if(parseInt(document.getElementById("gateAnswer").value,10)===answer){sfx.click();renderParentCenter()}else{sfx.wrong();toast("答案不对，请家长再试一次")}})}
function renderParentCenter(){clearArmed=false;const unitStats=UNITS.map(unit=>{const stars=store.stars[unit.id]||0,plays=store.plays[unit.id]||0,best=store.best[unit.id]||0,status=stars===3?"已掌握":stars===2?"基本掌握":stars===1||plays?"初步接触":"还没开始";return `<tr><td><b>${unit.no}</b> ${esc(unit.title)}</td><td>${starsTxt(stars)}</td><td>${plays}</td><td>${best?best+"%":"—"}</td><td>${store.last[unit.id]?fmtTime(store.last[unit.id]):"—"}</td><td><span class="status s${stars+1||1}">${status}</span></td></tr>`}).join("");
  showModal(`<div class="modal-head"><h2>家长中心</h2><button class="modal-close" id="closeModal">✕</button></div><div class="stats-grid"><div class="stat"><b>${totalStars()}</b><span>总星星</span></div><div class="stat"><b>${UNITS.filter(unit=>(store.plays[unit.id]||0)>0).length}</b><span>已闯关单元</span></div><div class="stat"><b>${store.totalGames}</b><span>游戏总次数</span></div><div class="stat"><b style="font-size:14px">${fmtTime(store.lastStudy)}</b><span>最近学习时间</span></div></div><div style="overflow:auto;margin-top:14px"><table class="parent-table"><thead><tr><th>单元</th><th>星星</th><th>次数</th><th>最佳正确率</th><th>最近成绩</th><th>掌握情况</th></tr></thead><tbody>${unitStats}</tbody></table></div><div style="display:flex;justify-content:flex-end;margin-top:15px"><button class="danger-btn" id="clearBtn">清空记录</button></div>`);
  document.getElementById("clearBtn").addEventListener("click",event=>{if(!clearArmed){clearArmed=true;event.target.textContent="再点一次确认清空";sfx.click();return}store={stars:{},plays:{},best:{},last:{},totalGames:0,lastStudy:0,sound:store.sound};save();toast("学习记录已清空");render();renderParentCenter()})}
function showModal(html){modalRoot.innerHTML=`<div class="modal-back"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;document.getElementById("closeModal").addEventListener("click",()=>{sfx.click();closeModal()});modalRoot.querySelector(".modal-back").addEventListener("click",event=>{if(event.target.classList.contains("modal-back"))closeModal()})}
function closeModal(){modalRoot.innerHTML=""}
let chineseVoice=null,speechRunToken=0,speechWarningShown=false;
function refreshChineseVoice(){if(!("speechSynthesis"in window))return;try{const voices=window.speechSynthesis.getVoices()||[];const chinese=voices.filter(voice=>/^zh([-_]|$)/i.test(voice.lang||"")||/chinese|中文|汉语|普通话/i.test(voice.name||""));chineseVoice=chinese.find(voice=>/xiaoxiao|huihui|yaoyao|female|女/i.test(voice.name||""))||chinese.find(voice=>voice.localService)||chinese[0]||null}catch(error){chineseVoice=null}}
if("speechSynthesis"in window){refreshChineseVoice();if(typeof window.speechSynthesis.addEventListener==="function")window.speechSynthesis.addEventListener("voiceschanged",refreshChineseVoice)}
function stopSpeech(){speechRunToken++;try{if("speechSynthesis"in window)window.speechSynthesis.cancel()}catch(error){}}
function normalizeSpeech(text){
  return String(text)
    .replace(/数一数/g,"鼠一鼠")
    .replace(/数一个/g,"鼠一个")
    .replace(/数数/g,"鼠树")
    .replace(/数到最后/g,"鼠到最后")
    .replace(/数到五/g,"鼠到五")
    .replace(/从0开始数/g,"从零开始鼠")
    .replace(/往前数/g,"往前鼠")
    .replace(/倒着数/g,"倒着鼠")
    .replace(/从头数/g,"从头鼠")
    .replace(/接着数/g,"接着鼠")
    .replace(/点着数/g,"点着鼠")
    .replace(/再数/g,"再鼠")
    .replace(/重新数/g,"重新鼠")
    .replace(/数出/g,"鼠出")
    .replace(/数完/g,"鼠完")
    .replace(/漏数/g,"漏鼠")
    .replace(/数对了/g,"鼠对了")
    .replace(/各数一遍/g,"各鼠一遍")
    .replace(/数一遍/g,"鼠一遍")
    .replace(/数(?=[一二三四五六七八九十])/g,"鼠")
    .replace(/数(?=\d)/g,"鼠")
    .replace(/数/g,"树");
}function speakText(text,options={}){if(!store.sound||!text)return false;if(!("speechSynthesis"in window)||typeof SpeechSynthesisUtterance==="undefined"){if(!speechWarningShown){speechWarningShown=true;toast("当前浏览器没有中文朗读功能，请换用 Edge、Chrome 或系统浏览器")}return false}refreshChineseVoice();try{stopSpeech();const runToken=speechRunToken,utterance=new SpeechSynthesisUtterance(normalizeSpeech(text));utterance.lang="zh-CN";utterance.rate=options.rate||.6;utterance.pitch=options.pitch||1.04;utterance.volume=1;if(chineseVoice)utterance.voice=chineseVoice;window.speechSynthesis.speak(utterance);return true}catch(error){return false}}
const AudioContext=window.AudioContext||window.webkitAudioContext;let audioCtx=null;
function tone(freq,duration,type,delay){if(!store.sound)return;try{audioCtx=audioCtx||new AudioContext();const start=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(.12,start);gain.gain.exponentialRampToValueAtTime(.001,start+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(start);osc.stop(start+duration)}catch(error){}}
const sfx={click(){tone(660,.08,"sine",0)},correct(){tone(680,.13,"sine",0);tone(920,.16,"sine",.1)},wrong(){tone(210,.19,"triangle",0);tone(160,.25,"triangle",.12)},cheer(){[523,659,784,1047].forEach((freq,index)=>tone(freq,.18,"sine",index*.11))}};
const confettiCanvas=document.getElementById("confettiCanvas"),confettiCtx=confettiCanvas.getContext("2d");
function resizeCanvas(){confettiCanvas.width=window.innerWidth;confettiCanvas.height=window.innerHeight}window.addEventListener("resize",resizeCanvas);resizeCanvas();
let confettiPieces=[],confettiRunning=false;
function confettiBurst(){confettiPieces=Array.from({length:100},()=>({x:Math.random()*confettiCanvas.width,y:-20-Math.random()*80,r:5+Math.random()*6,vy:2+Math.random()*4,vx:-1+Math.random()*2,rot:Math.random()*Math.PI,vr:-.08+Math.random()*.16,color:["#F2C14E","#34A853","#4A90D9","#EC7796","#8E7CC3"][Math.floor(Math.random()*5)]}));if(!confettiRunning){confettiRunning=true;requestAnimationFrame(confettiFrame)}}
function confettiFrame(){confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);confettiPieces.forEach(piece=>{piece.x+=piece.vx;piece.y+=piece.vy;piece.rot+=piece.vr;confettiCtx.save();confettiCtx.translate(piece.x,piece.y);confettiCtx.rotate(piece.rot);confettiCtx.fillStyle=piece.color;confettiCtx.fillRect(-piece.r,-piece.r/2,piece.r*2,piece.r);confettiCtx.restore()});confettiPieces=confettiPieces.filter(piece=>piece.y<confettiCanvas.height+30);if(confettiPieces.length)requestAnimationFrame(confettiFrame);else{confettiRunning=false;confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height)}}
render();
</script>
</body>
